name: APK 빌드

# 안드로이드 SDK가 깔린 GitHub 러너에서 APK를 만든다.
on:
  workflow_dispatch:          # Actions 탭에서 수동 실행
  push:
    branches: ['**']
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write             # 릴리스에 APK를 올리기 위해 필요

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비(캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      # 서명 키는 저장소에 두지 않고 Secrets 에서 꺼내 쓴다.
      # 키가 등록돼 있지 않으면 디버그 키로 서명해 빌드는 계속된다.
      - name: 서명 키 준비
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "정식 서명 키로 서명합니다."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 시크릿이 없어 디버그 키로 서명합니다. 빌드마다 키가 바뀌어 앱 업데이트 설치가 실패할 수 있습니다."
          fi

      - name: APK 빌드
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 서명 확인
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk workbook-scanner.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "### 서명 정보" >> "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify --print-certs --verbose workbook-scanner.apk | tee signing.txt
          {
            echo '```'
            grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" signing.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh workbook-scanner.apk

      # 만들어진 APK를 실제로 뜯어서 점검한다.
      # (비공개 저장소라 APK를 밖에서 받아볼 수 없으므로 로그로 남긴다)
      - name: APK 내용 점검
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)

          echo "===== 패키지 정보 ====="
          "$AAPT" dump badging workbook-scanner.apk 2>/dev/null \
            | grep -E "^package|^application-label|^launchable-activity|^uses-permission|sdkVersion" || true

          echo
          echo "===== 아이콘 리소스 ====="
          unzip -l workbook-scanner.apk | grep -E "ic_launcher" || echo "  (없음!)"

          echo
          echo "===== 웹앱이 저장소 index.html 과 동일한지 ====="
          unzip -p workbook-scanner.apk assets/index.html > packed.html
          A=$(sha256sum packed.html | cut -d' ' -f1)
          B=$(sha256sum index.html  | cut -d' ' -f1)
          echo "  APK 안 : $A"
          echo "  저장소  : $B"
          if [ "$A" = "$B" ]; then echo "  ✅ 완전히 같음"; else echo "  ❌ 다름!"; exit 1; fi

          echo
          echo "===== 인터넷 권한이 없는지 ====="
          if "$AAPT" dump badging workbook-scanner.apk 2>/dev/null | grep -q "android.permission.INTERNET"; then
            echo "  ❌ INTERNET 권한이 들어있다"; exit 1
          else
            echo "  ✅ INTERNET 권한 없음 (사진이 나갈 통로 자체가 없음)"
          fi

      # 릴리스로 올린다. 아티팩트 저장 용량 제한과 무관하고,
      # 주소가 고정이라 폰에서 바로 받기도 편하다.
      - name: 릴리스에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 \
            || gh release create apk-latest \
                 --title "문제집 스캐너 APK" \
                 --notes "가장 최근 빌드. 아래 workbook-scanner.apk 를 받아 설치하세요."
          gh release upload apk-latest workbook-scanner.apk --clobber
          echo "### APK 준비 완료 (서명: ${{ steps.ks.outputs.signed == 'true' && '정식 키' || '디버그 키' }})" >> "$GITHUB_STEP_SUMMARY"
          echo "[workbook-scanner.apk 받기](https://github.com/${GITHUB_REPOSITORY}/releases/tag/apk-latest)" >> "$GITHUB_STEP_SUMMARY"

      # 아티팩트로도 남기되, 용량이 꽉 차 있어도 빌드를 실패시키지 않는다
      - name: APK 첨부(보조)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: workbook-scanner-apk
          path: workbook-scanner.apk
          retention-days: 30
