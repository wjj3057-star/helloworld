<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111417">
<!-- 두 테마를 직접 다루므로 웹뷰가 임의로 색을 뒤집지 않게 한다 -->
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>문제집 스캐너 — 여러 장 찍어서 PDF 한 개로</title>
<style>
:root{
  --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323c;
  --fg:#e8edf3; --dim:#93a1b1; --accent:#4c8dff; --accent2:#2f6fd0;
  --danger:#ff5f56; --ok:#39d98a; --radius:14px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f2f4f7; --panel:#ffffff; --panel2:#f7f9fc; --line:#dfe5ec;
         --fg:#111820; --dim:#5c6b7a; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  display:flex; flex-direction:column;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}

/* ---------- header ---------- */
header{
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--line); background:var(--panel);
  position:sticky; top:0; z-index:5;
}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
header .count{
  margin-left:auto; font-size:13px; color:var(--dim);
  background:var(--panel2); border:1px solid var(--line);
  padding:4px 10px; border-radius:999px; white-space:nowrap;
}
.iconbtn{
  background:var(--panel2); border:1px solid var(--line); border-radius:10px;
  width:36px;height:36px; display:grid;place-items:center; cursor:pointer; font-size:16px;
}
.iconbtn:active{transform:scale(.94)}

/* ---------- main ---------- */
main{flex:1; overflow-y:auto; padding:14px 14px 8px; -webkit-overflow-scrolling:touch}
#grid{
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; position:relative; display:flex; flex-direction:column;
}
.card .thumbwrap{position:relative; aspect-ratio:3/4; background:var(--panel2); overflow:hidden}
.card img{width:100%;height:100%;object-fit:contain;display:block}
.card .num{
  position:absolute; top:6px; left:6px; z-index:2;
  background:rgba(0,0,0,.66); color:#fff; font-size:12px; font-weight:700;
  min-width:22px;height:22px; padding:0 6px; border-radius:999px;
  display:grid;place-items:center;
}
.card .spin{
  position:absolute; inset:0; display:grid; place-items:center;
  background:var(--panel2); color:var(--dim); font-size:12px;
}
.card .row{display:flex; border-top:1px solid var(--line)}
.card .row button{
  flex:1; background:transparent; border:0; padding:9px 0; cursor:pointer;
  font-size:14px; color:var(--dim);
}
.card .row button + button{border-left:1px solid var(--line)}
.card .row button:active{background:var(--panel2)}
.card .row button.del{color:var(--danger)}

.empty{
  text-align:center; color:var(--dim); padding:52px 20px; line-height:1.8;
}
.empty .big{font-size:44px; margin-bottom:6px}
.empty b{color:var(--fg)}

/* ---------- toolbar ---------- */
footer{
  border-top:1px solid var(--line); background:var(--panel);
  padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
  display:flex; gap:8px;
}
footer button{
  flex:1; border-radius:12px; border:1px solid var(--line); background:var(--panel2);
  padding:13px 8px; font-weight:600; cursor:pointer; font-size:14px;
}
footer button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
footer button:disabled{opacity:.45}
footer button:active{transform:scale(.98)}

/* ---------- overlays ---------- */
.overlay{
  position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.72);
  display:none; flex-direction:column;
}
.overlay.on{display:flex}
.sheet{
  margin-top:auto; background:var(--panel); border-radius:18px 18px 0 0;
  border-top:1px solid var(--line);
  padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
  max-height:92%; overflow-y:auto;
}
.sheet h2{margin:2px 0 14px; font-size:16px}
.field{display:flex; align-items:center; gap:10px; margin:12px 0}
.field label{flex:1; font-size:14px; color:var(--dim)}
.field input[type=text],.field input[type=number],.field select{
  background:var(--panel2); border:1px solid var(--line); color:var(--fg);
  border-radius:9px; padding:9px 10px; font:inherit; min-width:0; width:150px;
}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{
  background:var(--panel2); border:1px solid var(--line); border-radius:999px;
  padding:8px 14px; cursor:pointer; font-size:13px;
}
.seg button.sel{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.sheet .actions{display:flex; gap:8px; margin-top:16px}
.sheet .actions button{
  flex:1; padding:13px; border-radius:12px; border:1px solid var(--line);
  background:var(--panel2); cursor:pointer; font-weight:600;
}
.sheet .actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{font-size:12.5px;color:var(--dim);line-height:1.65;margin:8px 0 0}

/* ---------- crop editor ---------- */
#editor .top{
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  display:flex;gap:8px;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);
}
#editor .top .title{font-weight:700;font-size:15px}
#editor .top .sp{margin-left:auto}
#editor .stage{
  flex:1; position:relative; overflow:hidden; touch-action:none;
  display:grid; place-items:center; background:#000;
}
#cropHost{position:relative; touch-action:none}
#cropHost img{display:block; max-width:100%; max-height:100%; user-select:none; -webkit-user-drag:none}
#cropSvg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
#cropSvg polygon{fill:rgba(76,141,255,.18); stroke:#4c8dff; stroke-width:2; vector-effect:non-scaling-stroke}
#cropSvg polygon.bad{fill:rgba(255,95,86,.20); stroke:var(--danger)}
#edWarn{
  position:absolute; left:50%; transform:translateX(-50%); bottom:12px;
  background:var(--danger); color:#fff; padding:8px 14px; border-radius:999px;
  font-size:13px; font-weight:600; z-index:3; pointer-events:none;
}
#loupe{
  position:absolute; top:12px; left:12px; width:104px; height:104px; border-radius:50%;
  border:2px solid rgba(255,255,255,.9); box-shadow:0 4px 16px rgba(0,0,0,.5);
  background-repeat:no-repeat; background-color:#000; z-index:4; pointer-events:none;
}
#loupe.right{left:auto; right:12px}
/* 한가운데 십자선 — 어디를 맞추는 중인지 보이게 */
#loupe::before,#loupe::after{
  content:""; position:absolute; background:rgba(255,64,64,.9);
}
#loupe::before{left:50%; top:38%; width:1.5px; height:24%; transform:translateX(-50%)}
#loupe::after{top:50%; left:38%; height:1.5px; width:24%; transform:translateY(-50%)}
.handle{
  position:absolute; width:34px;height:34px; margin:-17px 0 0 -17px;
  border-radius:50%; background:rgba(76,141,255,.28); border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.5); touch-action:none; cursor:grab;
}
#editor .bottom{
  background:var(--panel); border-top:1px solid var(--line);
  padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);
  display:flex; flex-direction:column; gap:10px;
}
#editor .bottom .seg{justify-content:center}
#editor .bottom .actions{display:flex;gap:8px}
#editor .bottom .actions button{
  flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);cursor:pointer;font-weight:600;
}
#editor .bottom .actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- live camera ---------- */
#cam .camtop{
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; background:#000; color:#fff;
  display:flex;align-items:center;gap:10px;
}
#cam video{flex:1; width:100%; object-fit:cover; background:#000; min-height:0}
#cam .camtop .torch{
  margin-left:auto; background:transparent; border:1px solid rgba(255,255,255,.45);
  color:#fff; padding:7px 12px; border-radius:999px; cursor:pointer; font-size:13px;
  white-space:nowrap;
}
#cam .camtop .torch[aria-pressed="true"]{background:#fff; color:#000; border-color:#fff}
#cam #camAuto{margin-left:auto}
#cam #camTorch{margin-left:0}
/* 찾아낸 종이 테두리를 미리보기 위에 겹쳐 그린다 */
#camGuide{position:absolute; inset:0; pointer-events:none; z-index:2}
/* "빛이 반사돼요" 같은 한 줄 안내 */
#cam .camtip{
  position:absolute; left:50%; transform:translateX(-50%); bottom:120px;
  background:rgba(0,0,0,.72); color:#fff; padding:9px 15px; border-radius:999px;
  font-size:14px; z-index:3; pointer-events:none; max-width:86%; text-align:center;
}
#cam .cambottom{
  background:#000; color:#fff; padding:14px 20px calc(env(safe-area-inset-bottom) + 18px);
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
#shutter{
  width:70px;height:70px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.35);
  cursor:pointer;
}
#shutter:active{transform:scale(.93)}
#cam .camcount{font-size:14px;min-width:70px}
#cam .done{
  background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;
  padding:10px 16px;border-radius:10px;cursor:pointer;min-width:70px;font-weight:600;
}
/* 누른 곳에 초점을 맞췄다는 표시 */
.focusring{
  position:absolute; width:68px; height:68px; margin:-34px 0 0 -34px;
  border:2px solid #ffd400; border-radius:50%; opacity:0;
  pointer-events:none; z-index:3;
}
.focusring.on{animation:focuspop .7s ease-out}
@keyframes focuspop{
  0%{opacity:1; transform:scale(1.4)}
  60%{opacity:1; transform:scale(1)}
  100%{opacity:0; transform:scale(1)}
}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .18s}
.flash.on{opacity:.85;transition:none}

/* ---------- misc ---------- */
#toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px);
  transform:translateX(-50%) translateY(12px);
  background:#000d; color:#fff; padding:11px 18px; border-radius:999px;
  font-size:13.5px; z-index:60; opacity:0; transition:.22s; pointer-events:none;
  max-width:88vw; text-align:center;
}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
#busy{
  position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.6);
  display:none; place-items:center; color:#fff; text-align:center;
}
#busy.on{display:grid}
#busy .box{background:var(--panel);color:var(--fg);padding:22px 28px;border-radius:16px;min-width:200px}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header>
  <h1>문제집 스캐너</h1>
  <span class="count" id="count">0장</span>
  <button class="iconbtn" id="btnSettings" title="설정" aria-label="설정">⚙</button>
</header>

<main>
  <div id="grid"></div>
  <div class="empty" id="empty">
    <div class="big">📚</div>
    <b>푼 문제집을 찍어서 PDF 한 개로</b><br>
    아래 <b>연속 촬영</b>으로 페이지를 계속 찍거나,<br>
    이미 찍어둔 사진을 <b>불러오기</b> 하세요.<br><br>
    종이 영역을 자동으로 찾아 <b>반듯하게 펴고</b>,<br>
    그림자를 지워 <b>한 개의 PDF</b>로 만들어 줍니다.
  </div>
</main>

<footer>
  <button id="btnCam">📷 연속 촬영</button>
  <button id="btnPick">🖼 불러오기</button>
  <button id="btnPdf" class="primary">📄 PDF 만들기</button>
</footer>

<input id="filePick" class="sr" type="file" accept="image/*" multiple>
<input id="fileShot" class="sr" type="file" accept="image/*" capture="environment">

<!-- 연속 촬영 -->
<div class="overlay" id="cam" style="background:#000">
  <div class="camtop">
    <span id="camHint">종이 전체가 화면에 들어오게 찍으세요</span>
    <button class="torch" id="camAuto" hidden aria-pressed="true">⏱ 자동</button>
    <button class="torch" id="camTorch" hidden aria-pressed="false">🔦 조명</button>
  </div>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="camGuide"></canvas>
  <div class="camtip" id="camTip" hidden></div>
  <div class="focusring" id="focusRing"></div>
  <div class="cambottom">
    <span class="camcount" id="camCount">0장</span>
    <button id="shutter" aria-label="촬영"></button>
    <button class="done" id="camDone">완료</button>
  </div>
  <div class="flash" id="flash"></div>
</div>

<!-- 잘라내기 편집 -->
<div class="overlay" id="editor">
  <div class="top">
    <span class="title" id="edTitle">페이지 편집</span>
    <span class="sp"></span>
    <button class="iconbtn" id="edRotate" title="회전">⟳</button>
    <button class="iconbtn" id="edClose" title="닫기">✕</button>
  </div>
  <div class="stage">
    <div id="cropHost">
      <img id="cropImg" alt="">
      <svg id="cropSvg"><polygon id="cropPoly" points=""></polygon></svg>
      <div id="loupe" hidden></div>
      <div id="edWarn" hidden>모서리가 꼬였어요</div>
    </div>
  </div>
  <div class="bottom">
    <div class="seg" id="edFilter">
      <button data-f="doc">문서(기본)</button>
      <button data-f="bw">흑백 강조</button>
      <button data-f="photo">원본</button>
    </div>
    <div class="actions">
      <button id="edFull">전체 사용</button>
      <button id="edAuto">자동 감지</button>
      <button id="edApply" class="primary">적용</button>
    </div>
  </div>
</div>

<!-- 설정 -->
<div class="overlay" id="settings">
  <div class="sheet">
    <h2>설정</h2>
    <div class="field">
      <label for="setName">파일 이름</label>
      <input type="text" id="setName" placeholder="수학문제집">
    </div>
    <div class="field">
      <label for="setDate">이름에 날짜 붙이기</label>
      <input type="checkbox" id="setDate">
    </div>
    <div class="field">
      <label for="setSplit">한 파일 최대 용량(MB)<br><span style="font-size:11.5px">0 = 나누지 않음</span></label>
      <input type="number" id="setSplit" min="0" max="200" step="1" style="width:90px">
    </div>
    <div class="field">
      <label>기본 보정</label>
      <div class="seg" id="setFilter">
        <button data-f="doc">문서</button>
        <button data-f="bw">흑백</button>
        <button data-f="photo">원본</button>
      </div>
    </div>
    <div class="field">
      <label>화질</label>
      <div class="seg" id="setQuality">
        <button data-q="0.72">가벼움</button>
        <button data-q="0.82">보통</button>
        <button data-q="0.92">선명</button>
      </div>
    </div>
    <p class="hint">
      사진은 이 기기 안에서만 처리되고 <b>어디에도 올라가지 않습니다.</b><br>
      작업 중인 페이지는 자동 저장되어, 실수로 창을 닫아도 다시 열면 남아 있습니다.
    </p>
    <div class="actions">
      <button id="setClear" style="color:var(--danger)">전체 삭제</button>
      <button id="setClose" class="primary">닫기</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="busy"><div class="box"><div id="busyText">처리 중…</div><div class="bar"><i id="busyBar"></i></div></div></div>

<script>
"use strict";
/* =========================================================================
   문제집 스캐너 — 사진 여러 장을 반듯한 PDF 한 개로
   전부 브라우저 안에서 처리됩니다(서버 전송 없음).
   ========================================================================= */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

const SRC_MAX = 2000;   // 보관용 원본 최대 변 길이(px)
const OUT_MAX = 1700;   // 보정 결과 최대 변 길이(px)

const state = {
  pages: [],                       // {id, srcBlob, outBlob, url, corners, rot, filter, busy}
  settings: {
    name: "문제집", withDate: true, splitMB: 0, filter: "doc", quality: 0.82
  }
};

/* ---------------------------------------------------------------- toast/busy */
let toastTimer;
function toast(msg, ms = 2200) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), ms);
}
function busy(on, text = "처리 중…", pct = null) {
  $("#busy").classList.toggle("on", on);
  $("#busyText").textContent = text;
  $("#busyBar").style.width = pct == null ? "0%" : `${Math.round(pct * 100)}%`;
}
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

/* ================================================================= 저장소 */
const DB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const rq = indexedDB.open("workbook-scanner", 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains("pages")) db.createObjectStore("pages", { keyPath: "id" });
        if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    }).catch(() => null);
    return dbp;
  }
  async function tx(store, mode, fn) {
    const db = await open();
    if (!db) return null;
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && "result" in out ? out.result : out);
      t.onerror = () => rej(t.error);
    }).catch(() => null);
  }
  return {
    savePage: (p, order) => tx("pages", "readwrite", s => s.put({
      id: p.id, order, srcBlob: p.srcBlob, outBlob: p.outBlob,
      corners: p.corners, curve: p.curve || null, rot: p.rot, filter: p.filter
    })),
    delPage: id => tx("pages", "readwrite", s => s.delete(id)),
    clearPages: () => tx("pages", "readwrite", s => s.clear()),
    allPages: () => tx("pages", "readonly", s => s.getAll()),
    saveSettings: v => tx("meta", "readwrite", s => s.put(v, "settings")),
    loadSettings: () => tx("meta", "readonly", s => s.get("settings")),
  };
})();

// 순서 저장은 한 번에 하나씩만 돌린다. 연타로 여러 개가 겹쳐 돌면
// 실행 중에 바뀌는 배열을 읽게 되므로, 시작 시점의 목록을 복사해 쓴다.
let orderChain = Promise.resolve();
function persistOrder() {
  orderChain = orderChain.then(async () => {
    const snapshot = state.pages.slice();
    for (let i = 0; i < snapshot.length; i++) {
      // 아직 보정 중인 페이지는 저장하지 않는다. 결과물이 없는 상태로 저장되면
      // 다시 켰을 때 "보정 중…"에서 영영 멈춘 빈 페이지가 되살아난다.
      // 끝나는 즉시 자기 자리를 저장하므로 빠뜨리지도 않는다.
      if (snapshot[i].busy) continue;
      await DB.savePage(snapshot[i], i);
    }
  }).catch(e => console.error("순서 저장 실패:", e));
  return orderChain;
}

/* ================================================== 이미지 기본 유틸 */
// 아래 이미지 처리 함수들은 메인 스레드와 워커 양쪽에서 그대로 돌아야 한다.
// 워커에는 document 가 없으므로 캔버스는 반드시 이 헬퍼로만 만든다.
function mkCanvas(w, h) {
  if (typeof document !== "undefined") {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    return c;
  }
  return new OffscreenCanvas(w, h);
}

function canvasToBlob(canvas, quality) {
  if (canvas.convertToBlob) return canvas.convertToBlob({ type: "image/jpeg", quality });
  return new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
}

/**
 * Blob 또는 이미 디코드된 ImageBitmap 을 캔버스로 만든다.
 *
 * 연속 촬영은 비트맵을 그대로 넘긴다. 프레임을 JPEG 로 구웠다가 다시 푸는
 * 왕복(3MP 기준 인코드 1.4초 + 디코드)이 통째로 사라진다.
 */
async function blobToCanvas(src, maxDim) {
  let bmp;
  if (typeof ImageBitmap !== "undefined" && src instanceof ImageBitmap) {
    bmp = src;
  } else {
    try { bmp = await createImageBitmap(src, { imageOrientation: "from-image" }); }
    catch { bmp = await createImageBitmap(src); }
  }
  const s = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * s));
  const h = Math.max(1, Math.round(bmp.height * s));
  const c = mkCanvas(w, h);
  c.getContext("2d").drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  return c;
}

/* ============================================ 1) 종이 영역 자동 감지 */
function otsu(gray) {
  const hist = new Uint32Array(256);
  for (let i = 0; i < gray.length; i++) hist[gray[i]]++;
  const total = gray.length;
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = total - wB; if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * (mB - mF) * (mB - mF);
    if (v > best) { best = v; thr = t; }
  }
  return thr;
}

/* ---- 작업 버퍼 재사용 ----------------------------------------------
   감지 한 번에 후보 마스크를 열 개 넘게 만들고, 마스크마다 큰 배열을
   대여섯 개씩 쓴다. 매번 새로 할당하면 한 번 감지에 수십 MB 가 생겼다
   버려져 GC 가 중간중간 끼어든다(느린 폰에서 특히). 크기별로 하나씩
   들고 있다 다시 쓴다. 워커도 메인도 한 줄로 도는 코드라 안전하다. */
function scratch(store, key, make) {
  let b = store.get(key);
  if (!b) { b = make(); store.set(key, b); }
  return b;
}

/* --- 이진 마스크 닫힘 연산 (적분영상으로 반지름과 무관하게 O(1)/픽셀) --- */
function maskIntegral(mask, w, h) {
  const iw = w + 1;
  // 재사용 주의: 안쪽 칸은 매번 전부 덮어쓰고, 0행·0열은 처음 할당됐을 때의
  // 0 이 영영 유지된다(그 칸엔 아무도 쓰지 않는다). 그래서 지우지 않아도 된다.
  if (!maskIntegral.c) maskIntegral.c = new Map();
  const ii = scratch(maskIntegral.c, iw * (h + 1), () => new Int32Array(iw * (h + 1)));
  for (let y = 0; y < h; y++) {
    let row = 0;
    for (let x = 0; x < w; x++) {
      row += mask[y * w + x];
      ii[(y + 1) * iw + x + 1] = ii[y * iw + x + 1] + row;
    }
  }
  return ii;
}

/**
 * 팽창 후 침식(closing). 접힘부 그림자처럼 가느다란 틈을 메워
 * 갈라진 페이지를 한 덩어리로 만든다.
 * 가장자리에서는 창을 잘라 쓰므로, 화면 끝에 닿은 종이가 깎이지 않는다.
 */
function closeMask(mask, w, h, r) {
  const iw = w + 1;
  if (!closeMask.c) closeMask.c = new Map();
  // 두 단계가 앞 단계의 결과를 입력으로 받으므로 버퍼는 두 개를 번갈아 쓴다
  let flip = 0;
  const step = (src, needAll) => {
    const ii = maskIntegral(src, w, h);
    const out = scratch(closeMask.c, w * h * 2 + (flip ^= 1), () => new Uint8Array(w * h));
    for (let y = 0; y < h; y++) {
      const y0 = Math.max(0, y - r), y1 = Math.min(h - 1, y + r);
      for (let x = 0; x < w; x++) {
        const x0 = Math.max(0, x - r), x1 = Math.min(w - 1, x + r);
        const sum = ii[(y1+1) * iw + x1+1] - ii[y0 * iw + x1+1]
                  - ii[(y1+1) * iw + x0]   + ii[y0 * iw + x0];
        out[y * w + x] = needAll ? (sum === (y1-y0+1) * (x1-x0+1) ? 1 : 0)
                                 : (sum > 0 ? 1 : 0);
      }
    }
    return out;
  };
  return step(step(mask, false), true);
}

/** 가장 큰 연결 덩어리만 남긴다(8-이웃: 대각선으로도 이어짐) */
function largestBlob(mask, w, h) {
  const n = w * h;
  if (!largestBlob.c) largestBlob.c = new Map();
  const lab = scratch(largestBlob.c, n * 2, () => new Int32Array(n));
  const stack = scratch(largestBlob.c, n * 2 + 1, () => new Int32Array(n));
  lab.fill(0);
  let cur = 0, bestLab = 0, bestSize = 0;
  for (let i = 0; i < n; i++) {
    if (lab[i] || !mask[i]) continue;
    cur++;
    let sp = 0, size = 0;
    stack[sp++] = i; lab[i] = cur;
    while (sp) {
      const p = stack[--sp]; size++;
      const x = p % w, y = (p / w) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const q = yy * w + xx;
        if (!lab[q] && mask[q]) { lab[q] = cur; stack[sp++] = q; }
      }
    }
    if (size > bestSize) { bestSize = size; bestLab = cur; }
  }
  return { lab, bestLab, bestSize };
}

/** 덩어리의 행·열별 양 끝점 = 경계점 (볼록껍질 꼭짓점은 반드시 이 안에 있다) */
function borderPoints(lab, bestLab, w, h) {
  const pts = [];
  for (let y = 0; y < h; y++) {
    let l = -1, r = -1;
    for (let x = 0; x < w; x++) if (lab[y * w + x] === bestLab) { if (l < 0) l = x; r = x; }
    if (l >= 0) { pts.push([l, y]); if (r !== l) pts.push([r, y]); }
  }
  for (let x = 0; x < w; x++) {
    let t = -1, b = -1;
    for (let y = 0; y < h; y++) if (lab[y * w + x] === bestLab) { if (t < 0) t = y; b = y; }
    if (t >= 0) { pts.push([x, t]); if (b !== t) pts.push([x, b]); }
  }
  return pts;
}

const cross3 = (o, a, b) => (a[0]-o[0]) * (b[1]-o[1]) - (a[1]-o[1]) * (b[0]-o[0]);

function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (p.length < 3) return p;
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cross3(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i];
    while (up.length >= 2 && cross3(up[up.length-2], up[up.length-1], q) <= 0) up.pop(); up.push(q); }
  lo.pop(); up.pop();
  return lo.concat(up);
}

/** 면적을 가장 적게 잃는 꼭짓점부터 지워 껍질을 maxN개로 줄인다 */
function simplifyHull(hull, maxN) {
  const h = hull.slice();
  while (h.length > maxN) {
    let idx = 0, min = Infinity;
    for (let i = 0; i < h.length; i++) {
      const a = h[(i - 1 + h.length) % h.length], b = h[i], c = h[(i + 1) % h.length];
      const ar = Math.abs(cross3(a, b, c));
      if (ar < min) { min = ar; idx = i; }
    }
    h.splice(idx, 1);
  }
  return h;
}

/** 볼록껍질에서 넓이가 최대인 사각형 네 점 고르기 */
function maxAreaQuad(hull) {
  const m = hull.length;
  if (m < 4) return null;
  if (m === 4) return hull.slice();
  const tri = (a, b, c) => Math.abs(cross3(a, b, c));
  let best = null, bestA = -1;
  for (let i = 0; i < m - 3; i++)
    for (let j = i + 1; j < m - 2; j++)
      for (let k = j + 1; k < m - 1; k++)
        for (let l = k + 1; l < m; l++) {
          const a = tri(hull[i], hull[j], hull[k]) + tri(hull[i], hull[k], hull[l]);
          if (a > bestA) { bestA = a; best = [hull[i], hull[j], hull[k], hull[l]]; }
        }
  return best;
}

/** 점들을 직선으로 최소제곱 근사 → [a,b,c] (ax+by=c, a²+b²=1) */
function fitLine(pts) {
  let mx = 0, my = 0;
  for (const p of pts) { mx += p[0]; my += p[1]; }
  mx /= pts.length; my /= pts.length;
  let sxx = 0, syy = 0, sxy = 0;
  for (const p of pts) {
    const dx = p[0] - mx, dy = p[1] - my;
    sxx += dx * dx; syy += dy * dy; sxy += dx * dy;
  }
  const th = 0.5 * Math.atan2(2 * sxy, sxx - syy);   // 주성분 방향
  const a = -Math.sin(th), b = Math.cos(th);
  return [a, b, a * mx + b * my];
}
function lineFrom(p, q) {
  const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1;
  const a = -dy / L, b = dx / L;
  return [a, b, a * p[0] + b * p[1]];
}
function lineCross(l1, l2) {
  const det = l1[0] * l2[1] - l2[0] * l1[1];
  if (Math.abs(det) < 1e-9) return null;
  return [(l1[2] * l2[1] - l2[2] * l1[1]) / det, (l1[0] * l2[2] - l2[0] * l1[2]) / det];
}

/**
 * 꼭짓점 4개만 쓰지 않고, 각 변에 놓인 경계점 전체를 직선으로 근사한 뒤
 * 이웃 직선을 교차시켜 꼭짓점을 다시 구한다.
 * → 손가락·잡티 하나에 모서리가 끌려가지 않고 정확도도 올라간다.
 */
function refineQuad(quad, pts) {
  const lines = [];
  for (let e = 0; e < 4; e++) {
    const a = quad[e], b = quad[(e + 1) % 4];
    const len = dist(a, b) || 1;
    const tol = Math.max(2.5, len * 0.035);
    const inl = [];
    for (const p of pts) {
      const t = ((p[0]-a[0]) * (b[0]-a[0]) + (p[1]-a[1]) * (b[1]-a[1])) / (len * len);
      if (t < 0.12 || t > 0.88) continue;                 // 모서리 부근은 제외
      const d = Math.abs((b[0]-a[0]) * (a[1]-p[1]) - (a[0]-p[0]) * (b[1]-a[1])) / len;
      if (d < tol) inl.push(p);
    }
    lines.push(inl.length >= 10 ? fitLine(inl) : lineFrom(a, b));
  }
  const out = [];
  for (let i = 0; i < 4; i++) {
    const p = lineCross(lines[(i + 3) % 4], lines[i]);
    // 원래 꼭짓점에서 너무 멀리 튀면 신뢰하지 않음
    out.push(p && dist(p, quad[i]) < Math.max(12, dist(quad[i], quad[(i + 1) % 4]) * 0.3) ? p : quad[i]);
  }
  return out;
}

/** [TL, TR, BR, BL] 순서로 정렬 */
function orderCorners(q) {
  const cx = (q[0][0]+q[1][0]+q[2][0]+q[3][0]) / 4;
  const cy = (q[0][1]+q[1][1]+q[2][1]+q[3][1]) / 4;
  const s = q.slice().sort((a, b) =>
    Math.atan2(a[1]-cy, a[0]-cx) - Math.atan2(b[1]-cy, b[0]-cx));
  const xs = q.map(p => p[0]), ys = q.map(p => p[1]);
  const box = [[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.min(...ys)],
               [Math.max(...xs), Math.max(...ys)], [Math.min(...xs), Math.max(...ys)]];
  let best = 0, bestD = Infinity;
  for (let r = 0; r < 4; r++) {
    let d = 0;
    for (let i = 0; i < 4; i++) {
      const p = s[(r + i) % 4];
      d += (p[0]-box[i][0]) ** 2 + (p[1]-box[i][1]) ** 2;
    }
    if (d < bestD) { bestD = d; best = r; }
  }
  return [0, 1, 2, 3].map(i => s[(best + i) % 4]);
}

const polyArea = q => {
  let a = 0;
  for (let i = 0; i < q.length; i++) {
    const p = q[i], n = q[(i + 1) % q.length];
    a += p[0] * n[1] - n[0] * p[1];
  }
  return Math.abs(a) / 2;
};

/**
 * 네 점이 "꼬이지 않은" 사각형인가.
 *
 * 손으로 모서리를 끌다 이웃 모서리를 지나치면 변이 서로 교차해 나비넥타이가 된다.
 * 그대로 펴면 결과가 통째로 뭉개진다(실측: 진한 화소 15% → 66%).
 * 세 점씩 묶은 외적의 부호가 네 번 다 같아야 볼록한 사각형이다.
 *
 * 부호만 보면 모자란다. 세 점이 한 줄에 놓이면 외적이 0 이라 부호 검사를
 * 그냥 지나가는데, 그 사각형을 펴면 653x671 짜리 완전히 빈 그림이 나왔다.
 * 그래서 각 외적의 크기가 넓이에 견주어 충분한지도 함께 본다. 직사각형이면
 * 이 비가 1.0 이고, 비스듬히 찍힌 실제 종이도 0.3 아래로 내려가지 않는다.
 */
function isConvexQuad(q) {
  const area = polyArea(q);
  if (!(area > 0)) return false;
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) % 4], c = q[(i + 2) % 4];
    const cr = (b[0]-a[0]) * (c[1]-b[1]) - (b[1]-a[1]) * (c[0]-b[0]);
    if (Math.abs(cr) < area * 0.02) return false;      // 세 점이 한 줄에 가깝다
    const s = cr > 0 ? 1 : -1;
    if (!sign) sign = s;
    else if (s !== sign) return false;
  }
  return true;
}

/** 펴도 되는 사각형인가 — 꼬이지 않았고 너무 납작하지도 않은가 */
function usableQuad(q, w, h) {
  if (!q || q.length !== 4) return false;
  if (!q.every(p => p && isFinite(p[0]) && isFinite(p[1]))) return false;
  if (!isConvexQuad(q)) return false;
  return polyArea(q) > w * h * 0.01;                   // 화면의 1% 미만이면 쓸 수 없다
}

/** 사각형 후보가 얼마나 그럴듯한지 점수화 */
function scoreQuad(quad, mask, grad, gray, w, h, blobSize, gradMean, paperCh) {
  const area = polyArea(quad);
  const frame = w * h;
  if (area < 0.045 * frame) return null;                    // 너무 작음

  // 모양 검사: 볼록 + 각 내각이 45°~135° + 변 길이 편차
  const len = [];
  for (let i = 0; i < 4; i++) len.push(dist(quad[i], quad[(i + 1) % 4]));
  if (Math.min(...len) < 0.12 * Math.max(...len)) return null;
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const a = quad[i], b = quad[(i+1) % 4], c = quad[(i+2) % 4];
    const cr = cross3(a, b, c);
    if (sign === 0) sign = Math.sign(cr);
    else if (Math.sign(cr) !== sign) return null;           // 오목 → 탈락
    const v1 = [a[0]-b[0], a[1]-b[1]], v2 = [c[0]-b[0], c[1]-b[1]];
    const cosang = (v1[0]*v2[0] + v1[1]*v2[1]) /
                   ((Math.hypot(...v1) || 1) * (Math.hypot(...v2) || 1));
    if (Math.abs(cosang) > 0.72) return null;               // 약 44°~136° 밖 → 탈락
  }

  // 사각형 내부를 스캔라인으로 훑어 마스크와 얼마나 맞는지 + 안팎 밝기 차
  let inside = 0, hit = 0, pSum = 0, gSum = 0;
  const ys = quad.map(p => p[1]);
  const y0 = Math.max(0, Math.floor(Math.min(...ys))), y1 = Math.min(h - 1, Math.ceil(Math.max(...ys)));
  for (let y = y0; y <= y1; y++) {
    let xmin = Infinity, xmax = -Infinity;
    for (let i = 0; i < 4; i++) {
      const a = quad[i], b = quad[(i + 1) % 4];
      if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) {
        const x = a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0]);
        if (x < xmin) xmin = x;
        if (x > xmax) xmax = x;
      }
    }
    if (xmin > xmax) continue;
    const xa = Math.max(0, Math.round(xmin)), xb = Math.min(w - 1, Math.round(xmax));
    for (let x = xa; x <= xb; x++) {
      const i = y * w + x;
      inside++;
      if (mask[i]) hit++;
      if (paperCh) { pSum += paperCh[i]; gSum += gray[i]; }
    }
  }
  if (!inside) return null;
  const fill = hit / inside;                    // 사각형 안이 종이로 차 있는가
  const cover = blobSize ? hit / blobSize : 0;  // 종이를 빠짐없이 담았는가
  // 안이 "종이색"(밝고 색기 없음)인 정도. 흰 종이는 종이다움≈밝기라 1.0 근처,
  // 나무는 색이 있어 뚝 떨어진다(진한 나무 0.59 / 밝은 나무 0.79 / 미색 종이 0.92).
  const paperish = paperCh && gSum > 0 ? pSum / gSum : 1;

  // 변을 사이에 둔 안쪽/바깥쪽 밝기 단차.
  // 전체 평균으로 비교하면 글씨가 많은 페이지에서 오히려 안쪽이 어두워지므로,
  // 경계 바로 옆만 국소적으로 견준다.
  const cx = (quad[0][0]+quad[1][0]+quad[2][0]+quad[3][0]) / 4;
  const cy = (quad[0][1]+quad[1][1]+quad[2][1]+quad[3][1]) / 4;
  const off = Math.max(3, Math.round(Math.min(w, h) * 0.02));
  const off2 = Math.round(off * 2.5);            // "선 하나 너머"까지 나간 바깥
  let stepSum = 0, stepAbs = 0, stepN = 0, farSum = 0, farN = 0;
  for (let i = 0; i < 4; i++) {
    const a = quad[i], b = quad[(i + 1) % 4];
    const steps = Math.max(6, Math.round(dist(a, b) / 6));
    for (let k = 0; k <= steps; k++) {
      const t = 0.15 + 0.7 * (k / steps);
      const px = a[0] + t * (b[0]-a[0]), py = a[1] + t * (b[1]-a[1]);
      let nx = cx - px, ny = cy - py;
      const L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;      // 안쪽 방향
      const ix = Math.round(px + nx * off), iy = Math.round(py + ny * off);
      const ox = Math.round(px - nx * off), oy = Math.round(py - ny * off);
      if (ix < 0 || iy < 0 || ix >= w || iy >= h) continue;
      if (ox < 0 || oy < 0 || ox >= w || oy >= h) continue;
      const st = gray[iy * w + ix] - gray[oy * w + ox];
      stepSum += st; stepAbs += st < 0 ? -st : st; stepN++;
      const fx = Math.round(px - nx * off2), fy = Math.round(py - ny * off2);
      if (fx < 0 || fy < 0 || fx >= w || fy >= h) continue;
      farSum += gray[iy * w + ix] - gray[fy * w + fx]; farN++;
    }
  }
  const contrast = stepN ? stepSum / stepN : 0;
  const far = farN ? farSum / farN : contrast;
  // 단차의 "일관성" — 테두리를 한 바퀴 도는 동안 안팎 밝기차의 방향이 한결같은가.
  // 진짜 종이는 어느 변에서나 안쪽이 더 밝거나(어둡거나) 하므로 1에 가깝고,
  // 조명 경사를 임계값으로 자른 자리는 변마다 부호가 엇갈려 0에 가깝다.
  const agree = stepAbs > 0 ? Math.abs(stepSum) / stepAbs : 0;

  /* 변을 따라 실제 경계(밝기 변화)가 있는가 — 가짜 사각형을 걸러내는 핵심.
   *
   * 변 위를 그대로 찍으면 안 된다. 여기 들어오는 사각형은 420px 로 줄인 그림에서
   * 대충 잡은 것이라 진짜 테두리에서 서너 픽셀 비켜나 있다(원본 해상도 재정렬은
   * 이 다음 단계다). 그런데 어두운 책상 위 흰 종이의 경계는 폭이 3~4px 인 좁은
   * 봉우리라, 그 정도만 어긋나도 봉우리를 통째로 놓친다.
   *
   * 실측한 단면이다 — 변은 y=37 에 있는데 진짜 경계는 y=41 이었다.
   *   밝기   52  52  52  52  52 255 255      (y = 36…42)
   *   기울기  0   0   0  67 135 136  68
   * 그래서 완벽하게 찾아낸 흰 종이가 경계 강도 0 을 받고 있었다. 지표가 죽어
   * 있었던 것이라, 이걸 문턱으로 쓰면 멀쩡한 사진이 통째로 버려진다.
   *
   * 변의 법선 방향으로 ±R 만큼 훑어 가장 센 곳을 쓴다. "이 선 근처에 경계가
   * 있는가"를 묻는 것이 원래 의도이기도 하다. 값 개수는 예전 3x3(9번)과
   * 같아 비용도 그대로다.
   */
  const R = Math.max(3, Math.round(Math.min(w, h) / 110) + 2);
  let gs = 0, gn = 0;
  const edgeStr = [];                           // 변마다 따로도 남긴다(아래 검사들이 쓴다)
  const edgeSeen = [];                          // 그 변에서 실제로 재어진 표본 비율
  for (let i = 0; i < 4; i++) {
    const a = quad[i], b = quad[(i + 1) % 4];
    const len = dist(a, b) || 1;
    const enx = -(b[1] - a[1]) / len, eny = (b[0] - a[0]) / len;   // 변의 법선
    const steps = Math.max(8, Math.round(len / 2));
    let s1 = 0, n1 = 0, seen = 0;
    for (let k = 0; k <= steps; k++) {
      const t = k / steps;
      const px = a[0] + t * (b[0]-a[0]), py = a[1] + t * (b[1]-a[1]);
      let m = -1;
      for (let d = -R; d <= R; d++) {
        const x = Math.round(px + enx * d), y = Math.round(py + eny * d);
        if (x < 1 || y < 1 || x >= w - 1 || y >= h - 1) continue;
        const v = grad[y * w + x];
        if (v > m) m = v;
      }
      if (m < 0) { n1++; continue; }             // 이 표본은 화면 밖이라 못 쟀다
      s1 += m; n1++; seen++;
    }
    edgeStr.push(s1 / Math.max(1, n1));
    edgeSeen.push(seen / Math.max(1, steps + 1));
    gs += s1; gn += n1;
  }
  const norm = Math.max(6, gradMean * 3.2);
  const edge = clamp((gs / Math.max(1, gn)) / norm, 0, 1);
  // 네 변 중 가장 약한 변. 평균(edge)만 보면 변 하나가 글씨 줄을 가로질러
  // 얻은 큰 값이 나머지 빈 변들을 가려 버린다. 진짜 종이는 네 변이 모두
  // 자기 테두리 위에 있으므로 가장 약한 변도 0 이 아니다.
  //
  // 표본을 아예 못 잡은 변(화면 밖)은 판단에서 뺀다.
  //
  // 화면 테두리 "바로 안쪽"에 놓인 변까지 빼 볼까 했는데, 그러면 창문 옆에서
  // 찍은 밝기 경사 사진의 쓰레기 후보(화면 53%)가 같이 살아나 603px 를 잡는다.
  // 종이가 화면을 넘친 사진은 자르지 않고 원본을 그대로 쓰게 두는 편이,
  // 멀쩡한 사진에서 엉뚱한 데를 자르는 것보다 낫다.
  const measurable = [0, 1, 2, 3].filter(i => edgeSeen[i] >= 0.5);
  const edgeMin = measurable.length
    ? clamp(Math.min(...measurable.map(i => edgeStr[i])) / norm, 0, 1)
    : 0;

  // 변이 사각형 밖으로 "이어지는가" — 나무 널바닥에서 결정적인 검사.
  //
  // 널판 사이 홈은 진하고 곧아서, 홈 두 줄 사이의 띠가 채움 1.00 · 포함 1.00 ·
  // edge 1.0 을 받아 진짜 종이(3.5점)와 0.05점 차이까지 붙는다(실측 3.43~3.45).
  // 그 정도 차이는 조명 하나로 뒤집힌다 — 실사용에서 바닥을 잡는 원인.
  //
  // 종이 모서리는 꼭짓점에서 끝나지만 바닥 무늬 선은 화면을 가로질러 이어진다.
  // 진한 변마다 두 가지를 본다.
  //  · 연장선이 화면 안에 있으면: 그 위의 경계 강도가 변 위의 70% 를 넘는가
  //  · 연장선이 화면 밖이면: 변이 화면 끝에서 끝까지 가로지른다는 뜻이다.
  //    널판 홈이 정확히 이 모양이라, 이것도 "이어짐"으로 센다. 한쪽만 잘린
  //    종이는 이런 변이 하나뿐이므로 두 개부터 무늬로 판정해도 다치지 않는다.
  // 흐린 변(정규화 0.5 미만)은 아예 판단하지 않는다(흰-흰 종이 보호).
  let through = 0;
  for (let i = 0; i < 4; i++) {
    if (edgeStr[i] / norm < 0.5) continue;
    const a = quad[i], b = quad[(i + 1) % 4];
    const len = dist(a, b) || 1;
    const dx = (b[0]-a[0]) / len, dy = (b[1]-a[1]) / len;
    const step = Math.max(3, len * 0.045);
    let es = 0, en = 0;
    for (let k = 1; k <= 6; k++) {
      const cand = [[a[0] - dx * step * k, a[1] - dy * step * k],
                    [b[0] + dx * step * k, b[1] + dy * step * k]];
      for (const [px, py] of cand) {
        const x = Math.round(px), y = Math.round(py);
        if (x < 1 || y < 1 || x >= w - 1 || y >= h - 1) continue;
        let m = 0;
        for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++)
          m = Math.max(m, grad[(y+oy) * w + x+ox]);
        es += m; en++;
      }
    }
    // 연장선을 거의 못 재는 경우(표본이 화면 밖) — 두 갈래다.
    //  · 변의 양 끝이 화면 테두리에 닿아 있으면 진짜로 화면을 가로지르는 선이다
    //    (널판 홈이 이렇다) → 무늬로 센다
    //  · 그냥 종이가 커서 연장선이 곧 화면을 벗어나는 것뿐이면 아무 뜻도 없다
    //    → 세지 않는다. 예전엔 이걸 구분하지 않아, 화면을 크게 채운 종이가
    //    통째로 버려졌다(어두운 책상 위 흰 A4 가 아예 검출되지 않았다).
    const brd = Math.max(2, Math.min(w, h) * 0.012);
    const atBorder = p => p[0] <= brd || p[1] <= brd || p[0] >= w - 1 - brd || p[1] >= h - 1 - brd;
    if (en < 5) { if (atBorder(a) && atBorder(b)) through++; }
    else if (es / en >= 0.7 * edgeStr[i]) through++;  // 연장선에도 같은 경계가 있다
  }

  // 채움 0.84 는 실측으로 잡았다. 다섯 벤치 38장면의 후보를 전부 모아 보니
  // 진짜 종이 후보 167개의 채움 최저값이 0.897(비뚤게 찍은 저대비 A4)이고,
  // 크게 빗나간 후보 31개 중 12개가 그 아래에 있었다. 0.72 는 너무 헐거워서,
  // 형광등 아래 흰 라미네이트 책상(책상이 종이보다 밝은 경우)에서 채움 0.80
  // 짜리 쓰레기가 진짜 종이를 이기고 있었다.
  if (fill < 0.84 || cover < 0.55) return null;

  // 경계 강도(edge)에 크게 기대면 안 된다. 흰 종이를 흰 책상에 놓으면 종이
  // 가장자리는 흐린데 종이 안의 글씨 가장자리는 진해서, 글씨 덩어리가 종이를
  // 이겨 버린다(실측: 정답 edge 0.30 / 오답 edge 1.00).
  //
  // 대신 두 가지가 정답을 정확히 가리킨다.
  //  · 면적 — 종이는 글씨 덩어리보다 훨씬 크다 (21% 대 9%)
  //  · 안팎 밝기 단차의 부호 — 종이 안은 바깥보다 어둡지 않다.
  //    한참 어두우면 그건 종이가 아니라 잉크 덩어리다.
  // 가중치는 세 벤치(일반 14 / 저대비 5 / 흰 A4 7 장면)를 동시에 목적함수로
  // 놓고 실측으로 골랐다. 감으로 바꾸면 한쪽이 반드시 무너진다.
  //
  // 면적은 0.55 다. 예전에 0.90 이었는데, 그러면 폰 그림자가 페이지 한쪽에
  // 드리운 사진에서 "종이+그림자"를 한 덩어리로 잡은 후보(화면의 73%)가
  // 진짜 종이(23%)를 이겼다. 채움·포함·경계·단차 전부 진짜 종이가 나은데
  // 면적 하나로 뒤집힌 것이다. 실측으로 훑어보니 0.40~0.70 이 전부 통과하고
  // 0.75 부터 무너진다. 그 가운데를 잡았다.
  const ink = clamp((-contrast - 5) / 25, 0, 1);
  const score = 1.35 * fill + 1.15 * cover + 0.75 * edge
              + 0.55 * Math.min(area / frame, 0.95) - 1.60 * ink;
  return { score, fill, cover, edge, edgeMin, contrast, far, agree, areaPct: area / frame, through, paperish,
           eStr: [0, 1, 2, 3].map(i => +(edgeStr[i] / norm).toFixed(2)) };   // 변별 강도(측정용)
}

/** 3x3 상자 흐리기를 times 번 겹쳐 건다(분리형이라 반지름과 무관하게 싸다) */
function boxBlur3(src, w, h, times) {
  const n = w * h;
  if (!boxBlur3.c) boxBlur3.c = new Map();
  let cur = src, flip = 0;
  const t = scratch(boxBlur3.c, n * 3 + 2, () => new Uint16Array(n));
  for (let k = 0; k < times; k++) {
    const out = scratch(boxBlur3.c, n * 3 + (flip ^= 1), () => new Uint8Array(n));
    for (let y = 0; y < h; y++) {
      const o = y * w;
      t[o] = cur[o] * 2 + cur[o + 1];
      for (let x = 1; x < w - 1; x++) t[o + x] = cur[o + x - 1] + cur[o + x] + cur[o + x + 1];
      t[o + w - 1] = cur[o + w - 2] + cur[o + w - 1] * 2;
    }
    for (let y = 0; y < h; y++) {
      const up = y > 0 ? -w : 0, dn = y < h - 1 ? w : 0, row = y * w;
      for (let x = 0; x < w; x++) { const i = row + x; out[i] = (t[i + up] + t[i] + t[i + dn]) / 9; }
    }
    cur = out;
  }
  return cur === src ? Uint8Array.from(src) : cur;
}

/** 소벨 경계 강도 */
function sobelOn(sm, w, h) {
  // 한 번의 감지에서 결과 두 개(원래 경계, 크게 뭉갠 경계)가 동시에 살아
  // 있으므로 버퍼는 두 개를 엄격히 번갈아 쓴다. 세 개가 동시에 사는 일은 없다.
  if (!sobelOn.c) sobelOn.c = new Map();
  const n2 = w * h;
  sobelOn.flip = 1 - (sobelOn.flip || 0);
  const g = scratch(sobelOn.c, n2 * 2 + sobelOn.flip, () => new Uint8Array(n2));
  g.fill(0);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    const gx = -sm[i-w-1] - 2*sm[i-1] - sm[i+w-1] + sm[i-w+1] + 2*sm[i+1] + sm[i+w+1];
    const gy = -sm[i-w-1] - 2*sm[i-w] - sm[i-w+1] + sm[i+w-1] + 2*sm[i+w] + sm[i+w+1];
    // hypot 은 오버플로 방어 때문에 sqrt 보다 몇 배 느리다.
    // 여기 값은 커야 ±1020 이라 그 방어가 필요 없다.
    g[i] = Math.min(255, Math.sqrt(gx * gx + gy * gy) / 4);
  }
  return g;
}

/**
 * 경계선으로 둘러싸인 영역을 찾는다.
 *
 * 흰 A4 를 흰 책상에 놓으면 밝기로는 종이와 책상을 나눌 수 없다. 임계값을
 * 어디에 두든 둘이 같은 쪽으로 묶인다. 하지만 종이 가장자리에는 아무리
 * 흐려도 밝기 단차가 반드시 생긴다(종이 두께의 그림자, 재질 차이).
 *
 * 그래서 밝기가 아니라 "기울기가 큰 곳"을 선으로 보고, 끊긴 곳을 메운 뒤
 * 화면 테두리에서 물을 부어 잠기지 않는 안쪽을 종이 후보로 삼는다.
 * 밝기의 높낮이와 무관하므로 종이가 더 밝든 어둡든 똑같이 동작한다.
 */
function enclosedByEdges(grad, w, h, thr, closeR) {
  const n = w * h;
  if (!enclosedByEdges.c) enclosedByEdges.c = new Map();
  const edge = scratch(enclosedByEdges.c, n * 4, () => new Uint8Array(n));
  for (let i = 0; i < n; i++) edge[i] = grad[i] >= thr ? 1 : 0;
  const sealed = closeMask(edge, w, h, closeR);        // 끊긴 선 잇기

  // 테두리에서 선이 아닌 곳을 따라 채운다 = 바깥
  const outside = scratch(enclosedByEdges.c, n * 4 + 1, () => new Uint8Array(n));
  outside.fill(0);
  const st = scratch(enclosedByEdges.c, n * 4 + 2, () => new Int32Array(n));
  let sp = 0;
  const push = i => { if (!sealed[i] && !outside[i]) { outside[i] = 1; st[sp++] = i; } };
  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
  while (sp) {
    const p = st[--sp], x = p % w, y = (p / w) | 0;
    if (x > 0)     push(p - 1);
    if (x < w - 1) push(p + 1);
    if (y > 0)     push(p - w);
    if (y < h - 1) push(p + w);
  }

  // 잠기지 않은 곳 = 선으로 둘러싸인 안쪽 (선 자체도 종이의 일부이므로 포함)
  const inside = scratch(enclosedByEdges.c, n * 4 + 3, () => new Uint8Array(n));
  for (let i = 0; i < n; i++) inside[i] = outside[i] ? 0 : 1;
  return inside;
}

/**
 * 점들에 2차식 y = c0 + c1·x + c2·x² 을 최소제곱으로 맞춘다.
 * 변이 직선에서 얼마나 벗어나는지(=휜 정도)를 나타내는 데 쓴다.
 */
function fitQuad(xs, ys) {
  let s0 = xs.length, s1 = 0, s2 = 0, s3 = 0, s4 = 0, t0 = 0, t1 = 0, t2 = 0;
  for (let i = 0; i < xs.length; i++) {
    const x = xs[i], y = ys[i], x2 = x * x;
    s1 += x; s2 += x2; s3 += x2 * x; s4 += x2 * x2;
    t0 += y; t1 += x * y; t2 += x2 * y;
  }
  return solve([[s0, s1, s2], [s1, s2, s3], [s2, s3, s4]], [t0, t1, t2], 3);
}

/**
 * 대충 잡은 사각형을 원본 해상도에서 다시 맞춘다.
 *
 * 감지는 420px 로 줄여서 하므로, 거기서 생긴 1px 오차가 원본에서는
 * 2~3px 로 확대된다. 각 변을 따라가며 원본에서 밝기가 가장 급하게
 * 변하는 지점을 부분화소까지 찾아 직선을 다시 맞추고, 이웃 직선을
 * 교차시켜 꼭짓점을 구한다. 확대로 생긴 오차가 사라진다.
 *
 * 경계가 흐릿하거나 결과가 원래 위치에서 크게 벗어나면 null 을 돌려
 * 호출부가 기존(대충 잡은) 값을 그대로 쓰게 한다.
 */
function refineOnSource(canvas, quad, srcData) {
  refineOnSource.why = "";                       // 측정용: 실패하면 이유가 남는다
  const w = canvas.width, h = canvas.height;
  if (w < 40 || h < 40) return null;
  // 원본 픽셀은 원근 보정에서도 쓴다. 넘겨받으면 다시 읽지 않는다(전체 읽기는 비싸다).
  const im = srcData || canvas.getContext("2d", { willReadFrequently: true })
                              .getImageData(0, 0, w, h).data;

  const lum = (x, y) => {
    const xi = x < 0 ? 0 : (x > w - 1 ? w - 1 : x | 0);
    const yi = y < 0 ? 0 : (y > h - 1 ? h - 1 : y | 0);
    const i = (yi * w + xi) * 4;
    return (im[i] * 299 + im[i + 1] * 587 + im[i + 2] * 114) / 1000;
  };

  const lines = [], edgePts = [];
  let refined = 0;
  for (let e = 0; e < 4; e++) {
    const a = quad[e], b = quad[(e + 1) % 4];
    const len = dist(a, b);
    if (len < 20) return null;
    const nx = -(b[1] - a[1]) / len, ny = (b[0] - a[0]) / len;   // 변의 법선
    const tx = (b[0] - a[0]) / len, ty = (b[1] - a[1]) / len;    // 변의 방향
    const R = Math.max(3, Math.min(24, Math.round(len * 0.03))); // 탐색 반경
    const M = 2 * R + 1;
    const g = new Float32Array(M);
    const pts = [];

    // 밝기를 변 방향으로 3점 평균해서 읽는다. 광택·질감 책상의 잡음은 방향이
    // 없어 평균에서 √3 배 줄지만, 종이 경계는 변 방향으로 이어져 있어 그대로
    // 남는다. 실측: 잡음 기울기(±26)가 실제 단차(8)를 이기던 광택 장면이
    // 16.6px → 8.4px 로 뒤집힌다. 5점 평균도 재 봤는데 광택은 비슷하고
    // 질감 책상이 오히려 나빠져(9.8→11.6px) 3점으로 잡았다.
    const lum3 = (x, y) => (lum(x - tx, y - ty) + lum(x, y) + lum(x + tx, y + ty)) / 3;

    const N = 64;
    for (let k = 0; k <= N; k++) {
      const t = 0.08 + 0.84 * (k / N);            // 모서리 부근은 제외
      const px = a[0] + t * (b[0] - a[0]), py = a[1] + t * (b[1] - a[1]);

      // 법선 방향 밝기 프로파일의 기울기
      let peak = -1, best = 0, sum = 0;
      for (let si = 1; si < M - 1; si++) {
        const o = si - R;
        g[si] = Math.abs(lum3(px + nx * (o + 1), py + ny * (o + 1))
                       - lum3(px + nx * (o - 1), py + ny * (o - 1)));
        sum += g[si];
        if (g[si] > best) { best = g[si]; peak = si; }
      }
      // 문턱을 고정 10 으로 두면 "종이와 책상 밝기가 거의 같은" 장면에서
      // 모든 표본이 떨어져 변 하나에 점이 0개가 됐다(실측). 흐린 경계라도
      // 주변이 조용하면 도드라진다 — 봉우리가 프로파일의 나머지 평균보다
      // 3배 크면 받는다. 잡음 많은 책상에서는 나머지 평균이 커서 문턱이
      // 도로 10 이 되므로, 예전보다 헐거워지는 일은 없다.
      // 바닥 3 도 재서 정했다: 4 면 단차 4짜리 변(책상이 더 밝은 장면의
      // 그림자 없는 쪽)을 놓쳐 5.0px 에 머물고, 3 이면 1.7px. 2.5 는 더
      // 얻는 것 없이 잡음에 가까워질 뿐이라 3 에 두었다.
      const others = (sum - best) / Math.max(1, M - 3);
      if (peak < 1 || peak > M - 2 || best < Math.max(3, Math.min(10, 3 * others))) continue;

      // 꼭짓점 세 개로 포물선을 맞춰 부분화소 위치를 얻는다
      const gm = g[peak - 1], g0 = g[peak], gp = g[peak + 1];
      const den = gm - 2 * g0 + gp;
      const sub = Math.abs(den) > 1e-6 ? clamp(0.5 * (gm - gp) / den, -1, 1) : 0;
      const off = (peak - R) + sub;
      pts.push([px + nx * off, py + ny * off]);
    }
    if (pts.length < 12) {
      // 이 변만 원본에서 못 찾았다. 예전엔 여기서 전부 포기해 네 변이 통째로
      // 대충 값으로 남았는데, 찾은 변까지 버릴 이유가 없다. 이 변은 대충 값의
      // 직선을 그대로 쓰고 나머지 변은 재정렬한다.
      refineOnSource.why += `변${e} 대충유지(${pts.length}점) `;
      lines.push(lineFrom(a, b));
      edgePts.push([]);
      continue;
    }

    // 튀는 점을 걸러내고 다시 맞춘다. 한 번으로는 이상점이 반쯤 섞인 변에서
    // 중앙값 자체가 커서 못 거르므로, 맞추고-거르기를 두 번 반복한다.
    let keep = pts;
    let L = fitLine(keep);
    for (let it = 0; it < 2; it++) {
      const resid = keep.map(q => Math.abs(L[0] * q[0] + L[1] * q[1] - L[2]));
      const med = resid.slice().sort((x, y) => x - y)[resid.length >> 1];
      const next = keep.filter((q, i) => resid[i] <= Math.max(1.5, med * 2.5));
      if (next.length < 12 || next.length === keep.length) break;
      keep = next;
      L = fitLine(keep);
    }
    lines.push(L);
    edgePts.push(keep);
    refined++;
  }
  if (refined < 2) { refineOnSource.why = `재정렬된 변 ${refined}개뿐`; return null; }

  const out = [];
  for (let i = 0; i < 4; i++) {
    const p = lineCross(lines[(i + 3) % 4], lines[i]);
    if (!p) { refineOnSource.why = `꼭짓점${i} 교차실패`; return null; }
    const limit = Math.max(8, dist(quad[i], quad[(i + 1) % 4]) * 0.06);
    if (dist(p, quad[i]) > limit) {              // 너무 멀리 튀면 믿지 않는다
      refineOnSource.why = `꼭짓점${i} 벗어남(${dist(p, quad[i]).toFixed(1)}px>${limit.toFixed(1)})`;
      return null;
    }
    out.push(p);
  }
  return { corners: out, curve: measureCurve(out, edgePts) };
}

/**
 * 네 변이 직선에서 얼마나 벗어나는지 재서 "휨"으로 돌려준다.
 *
 * 두꺼운 문제집을 펼치면 접지선 쪽이 들리면서 종이가 원기둥처럼 휜다.
 * 꼭짓점 네 개만 쓰는 원근 보정으로는 이걸 펼 수 없다 — 변 자체가 곡선이라
 * 결과물의 위아래가 활처럼 휘고 모서리에 책상이 삐져 들어온다.
 *
 * 경계점들을 "펴진 직사각형 좌표"로 옮겨 놓으면, 평평한 종이는 변이 0 또는 1
 * 에 딱 붙고 휜 종이는 그만큼 벗어난다. 그 벗어남을 변마다 2차식으로 맞춰 둔다.
 * warp 가 이 값만큼 표본 위치를 되밀어 편다.
 *
 * @returns {{top:number[],right:number[],bottom:number[],left:number[],max:number}|null}
 */
function measureCurve(corners, edgePts) {
  // 원본 → 단위 직사각형
  const hi = homography(corners, [[0, 0], [1, 0], [1, 1], [0, 1]]);
  if (!hi) return null;
  const toRect = (p) => {
    const den = hi[6] * p[0] + hi[7] * p[1] + 1;
    if (!den) return null;
    return [(hi[0] * p[0] + hi[1] * p[1] + hi[2]) / den,
            (hi[3] * p[0] + hi[4] * p[1] + hi[5]) / den];
  };

  // 변마다 (진행 방향 좌표, 직선에서 벗어난 정도)
  //   0=위(v가 0이어야), 1=오른쪽(u가 1), 2=아래(v가 1), 3=왼쪽(u가 0)
  const AXIS = [1, 0, 1, 0];        // 벗어남을 재는 축 (1=v, 0=u)
  const BASE = [0, 1, 1, 0];        // 평평하면 나와야 하는 값
  const fits = [];
  let max = 0;
  for (let e = 0; e < 4; e++) {
    const xs = [], ys = [];
    for (const p of edgePts[e]) {
      const r = toRect(p);
      if (!r) continue;
      const along = r[1 - AXIS[e]], dev = r[AXIS[e]] - BASE[e];
      if (along < -0.2 || along > 1.2 || Math.abs(dev) > 0.25) continue;  // 튄 점
      xs.push(along); ys.push(dev);
    }
    if (xs.length < 12) return null;
    const c = fitQuad(xs, ys);
    if (!c || !isFinite(c[0]) || !isFinite(c[1]) || !isFinite(c[2])) return null;
    for (let k = 0; k <= 10; k++) {
      const t = k / 10;
      max = Math.max(max, Math.abs(c[0] + c[1] * t + c[2] * t * t));
    }
    fits.push(c);
  }
  // 거의 평평하면 굳이 건드리지 않는다(측정 잡음을 왜곡으로 바꿔 넣지 않도록).
  // 반대로 너무 크면 경계를 잘못 잡은 것이므로 믿지 않는다.
  if (max < 0.004 || max > 0.14) return null;
  return { top: fits[0], right: fits[1], bottom: fits[2], left: fits[3], max };
}

/**
 * 종이 영역을 자동으로 찾는다.
 *
 * 임계값 하나로 자르면 그림자 진 모서리가 잘려 나가거나(조명 얼룩),
 * 책 접힘부 그림자에 페이지가 두 조각으로 갈라진다. 그래서
 *   ① 밝기 / "종이다움"(밝고 채도 낮음) 두 채널에 대해
 *   ② 여러 임계값으로 후보 마스크를 만들고 닫힘 연산으로 틈을 메운 뒤
 *   ③ 볼록껍질에서 넓이 최대 사각형을 뽑고 변마다 직선을 다시 맞춰
 *   ④ 채움·포함·경계강도로 점수를 매겨 가장 그럴듯한 것을 고른다.
 *
 * @returns {[number,number][]|null} [TL,TR,BR,BL] (canvas 좌표) 또는 null(=자를 필요 없음/실패)
 */
/**
 * @param fast 실시간 안내용 — 원본 해상도 재정렬(부분화소·휨 측정)을 건너뛴다.
 *             안내선에는 그 정밀도가 필요 없고, 실제 촬영본은 어차피 전체
 *             경로로 다시 감지한다.
 */
function detectCorners(canvas, srcData, fast) {
  detectCorners.curve = null;
  if (detectCorners.debug) detectCorners.all = [];
  const D = 420;
  const s = Math.min(1, D / Math.max(canvas.width, canvas.height));
  const w = Math.max(8, Math.round(canvas.width * s));
  const h = Math.max(8, Math.round(canvas.height * s));
  const c = mkCanvas(w, h);
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(canvas, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;

  const n = w * h;
  if (!detectCorners.c) detectCorners.c = new Map();
  const gray = scratch(detectCorners.c, n * 4, () => new Uint8Array(n));
  const paper = scratch(detectCorners.c, n * 4 + 1, () => new Uint8Array(n));
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const r = d[p], g = d[p+1], b = d[p+2];
    gray[i] = (r * 299 + g * 587 + b * 114) / 1000 | 0;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    paper[i] = mx * (1 - (mx ? (mx - mn) / mx : 0));   // 밝고 색기 없는 정도
  }

  // 경계 강도(소벨) — 후보 채점과 경계 기반 후보 생성에 함께 쓴다.
  // 재기 전에 밝기를 뭉갠다. 책상 질감이나 노이즈가 만드는 가짜 경계를 줄여
  // 흐릿한 종이 가장자리가 묻히지 않게 한다.
  const grad = sobelOn(boxBlur3(gray, w, h, 1), w, h);
  let gradSum = 0;
  for (let i = 0; i < n; i++) gradSum += grad[i];
  const gradMean = gradSum / n;

  const levels = ch => {
    const t = otsu(ch);
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) hist[ch[i]]++;
    const pct = p => { let a = 0; for (let i = 0; i < 256; i++) { a += hist[i]; if (a >= n * p) return i; } return 255; };
    return [...new Set([t, t*0.92, t*0.84, t*0.74, t*0.62, pct(0.32), pct(0.48)]
      .map(v => clamp(Math.round(v), 2, 253)))];
  };

  const closeR = Math.max(1, Math.round(Math.min(w, h) / 110));
  let best = null, bestScore = -Infinity, bestInfo = null;

  // 후보 마스크 하나를 사각형으로 바꿔 점수를 매긴다(밝기 기반과 경계 기반이 공유)
  const consider = (mask, maxEdge = Infinity) => {
    const { lab, bestLab, bestSize } = largestBlob(mask, w, h);
    if (!bestLab) return;
    const ratio = bestSize / n;
    if (ratio < 0.04 || ratio > 0.985) return;

    const pts = borderPoints(lab, bestLab, w, h);
    if (pts.length < 12) return;
    const hull = simplifyHull(convexHull(pts), 26);
    if (hull.length < 4) return;
    let quad = maxAreaQuad(hull);
    if (!quad) return;
    quad = orderCorners(refineQuad(orderCorners(quad), pts));

    const sc = scoreQuad(quad, mask, grad, gray, w, h, bestSize, gradMean, paper);
    if (!sc) return;
    // 경계 기반 경로 전용: 변이 진한 경계 위에 놓인 후보는 여기 것이 아니다.
    // 이 경로는 "밝기로는 안 보이는 흐린 종이 테두리"를 찾으려고 있다. 진한
    // 경계를 따라 만들어진 사각형은 십중팔구 글씨 덩어리의 외곽이고, 진짜
    // 종이였다면 앞의 밝기 기반 경로가 이미 찾았다.
    // (실측: 글씨 덩어리 edge 1.00 / 흰 종이의 흐린 테두리 0.22~0.54)
    if (sc.edge >= maxEdge) return;
    // 종이가 아닌 게 확실한 후보는 여기서 버린다. 끝에 가서 버리면 늦다 —
    // 그때까지 "제일 좋은 후보" 자리를 차지하고 앉아, 뒤에 올 다른 방식들이
    // "이미 괜찮은 답이 있다"고 판단해 아예 돌지 않는다.
    // (실측: 화면 99%를 덮는 쓰레기 후보가 3.0점을 받아 2·3차를 막고 있었다)
    if (sc.areaPct > 0.93) return;                          // 화면을 거의 다 덮음
    if (sc.edge < 0.10 && Math.abs(sc.contrast) < 3) return; // 경계도 단차도 없음
    // 변 위에 밝기 변화가 사실상 하나도 없으면 종이 테두리일 수 없다.
    // 천장등·창문이 만드는 완만한 밝기 경사를 임계값으로 자르면 이런 후보가
    // 나온다 — 경계랄 게 없는데도 채움·포함이 만점이라 점수는 높다.
    // (실측: 진짜 종이 최저 0.112 / 경사를 자른 화면 82% 짜리 후보 0.02)
    if (sc.edge < 0.05) return;
    // 네 변이 "모두" 자기 테두리 위에 있어야 한다.
    //
    // 평균만 보면 속는다. 형광등 아래 흰 라미네이트 책상(책상이 종이보다 밝은
    // 경우)에서 화면 49% 짜리 쓰레기 후보가 평균 0.59 로 진짜 종이(0.19)를
    // 크게 앞섰는데, 뜯어보니 변 하나가 인쇄된 글씨 줄을 길게 가로질러 얻은
    // 점수였고 나머지 변은 맨 책상 위라 사실상 0 이었다.
    //
    // 문턱 0.04 는 실측으로 잡았다. 37장면의 정답 후보 중 가장 약한 변이
    // 0.070(흰 책상·거의 같은 밝기)이고, 0.03~0.07 어디에 두어도 37/37 이
    // 나온다. 정답을 놓치는 쪽이 더 나쁘므로 아래쪽으로 여유를 두었다.
    if (sc.edgeMin < 0.04) return;
    // 변 안쪽이 바깥쪽보다 한참 어두우면, 종이 테두리가 아니라 잉크 한가운데에
    // 선을 그은 것이다. 종이 가장자리는 안쪽이 여백(밝음)이라 이렇게 될 수 없다.
    // (실측: 진짜 종이 -4~+203 / 글씨 한가운데를 두른 사각형 -110)
    if (sc.contrast < -40) return;
    // 진한 변이 두 개 이상 사각형 밖으로 이어지면 종이가 아니라 바닥 무늬다.
    // 종이 모서리는 꼭짓점에서 끝난다. 한 변쯤은 우연히 무늬 위에 얹힐 수
    // 있으니 두 변부터 버린다. (실측: 널바닥 띠 through 2 / 진짜 종이 0)
    if (sc.through >= 2) return;
    // 이어지는 변이 하나뿐이면 "한쪽이 잘린 종이"와 모양이 같아 이것만으로는
    // 못 버린다. 내용물로 가른다.
    //  · far — 종이는 먼 바깥(옆 널판 너머)보다도 밝지만, 널바닥 띠는 홈 선
    //    하나만 지나면 도로 같은 바닥이라 먼 단차가 없다
    //  · paperish — 안이 종이색(밝고 색기 없음)인가. 널판끼리 색이 달라 far
    //    단차가 진짜로 생기는 바닥(실측 26~53)은 이것으로만 걸린다
    // 흔한 촬영(네 변이 다 보이는 종이)은 through 0 이라 여기 안 온다.
    if (sc.through >= 1 && (sc.far < 18 || sc.paperish < 0.87)) return;
    if (detectCorners.debug) detectCorners.all.push({ ...sc, quad: quad.map(p => [p[0] / s, p[1] / s]) });
    if (sc.score > bestScore) {
      bestScore = sc.score; best = quad; bestInfo = sc;
    }
  };

  const scan = (channels) => {
  for (const ch of channels) {
    // 같은 채널 안에서는 임계값이 내려갈수록 마스크가 단조로 커지므로
    // "켜진 픽셀 수가 같으면 사실상 같은 마스크"로 보고 건너뛴다.
    // 채널이 다르면 픽셀 수가 비슷해도 모양이 전혀 다를 수 있으므로 채널마다 새로 센다.
    const seen = [];
    for (const t of levels(ch)) {
      const mask0 = scratch(detectCorners.c, n * 4 + 2, () => new Uint8Array(n));
      let on = 0;
      for (let i = 0; i < n; i++) { const v = ch[i] > t ? 1 : 0; mask0[i] = v; on += v; }
      if (on < n * 0.03 || on > n * 0.995) continue;
      // 거의 같은 마스크를 다시 계산하지 않는다
      if (seen.some(v => Math.abs(v - on) < n * 0.005)) continue;
      seen.push(on);

      // 닫힘 연산: 접힘부 그림자처럼 가느다란 틈을 메워 한 덩어리로
      consider(closeMask(mask0, w, h, closeR));
    }
  }
  };

  // 1차: 종이가 배경보다 밝다는 흔한 경우
  scan([gray, paper]);

  // 2차: 반대인 경우. 누런 종이를 흰 책상에 놓으면 종이가 더 어둡다.
  // 1차에서 그럴듯한 후보를 못 찾았을 때만 돌려 평소 속도는 유지한다.
  if (!best || bestScore < 2.6) {
    const inv = scratch(detectCorners.c, n * 4 + 3, () => new Uint8Array(n));
    for (let i = 0; i < n; i++) inv[i] = 255 - gray[i];
    scan([inv]);
  }

  // 3차: 경계선으로 둘러싸인 영역. 흰 A4 를 흰 책상에 놓는 주 용도가 여기에 해당한다.
  // 밝기로는 나눌 수 없어도 가장자리의 미세한 단차는 남으므로, 그 선을 따라간다.
  //
  // 비용이 큰 경로라, 밝기 기반이 이미 확실한 답을 낸 경우에는 건너뛴다.
  // 종이와 책상 밝기가 뚜렷이 다르면(단차 25 이상) 1차 결과를 믿어도 된다.
  if (!best || bestInfo.edge < 0.9 || bestInfo.contrast < 25) {
    // 분위수만 쓰면 평평한 장면에서 문턱이 너무 높아져 흐린 가장자리를 놓치므로
    // 낮은 고정값도 함께 시도한다. 선을 잇는 반지름(closeR*3)은 넉넉히 준다.
    // 종이와 책상 밝기가 거의 같으면 가장자리 신호가 변마다 끊겨서,
    // 좁게 이으면 테두리가 닫히지 않는다.
    //
    // 이 경로만 "변이 진한 경계 위에 있으면 안 된다"는 조건을 건다(consider 참고).
    // 걸러져서 아무 후보도 안 남으면 자르지 않고 원본을 그대로 쓴다.
    const tryEdges = (g) => {
      const hist2 = new Uint32Array(256);
      for (let i = 0; i < n; i++) hist2[g[i]]++;
      const q = p => { let a = 0; for (let i = 0; i < 256; i++) { a += hist2[i]; if (a >= n * p) return i; } return 255; };
      const seen = [];
      for (const t0 of [2, 3, 5, q(0.80), q(0.90), q(0.96)]) {
        const t = Math.max(2, t0 | 0);
        if (seen.includes(t)) continue;
        seen.push(t);
        consider(enclosedByEdges(g, w, h, t, closeR * 3), 0.85);
      }
    };
    tryEdges(grad);

    // 결이 있는 책상(나뭇결·천·광택 얼룩)에서는 위가 통하지 않는다. 문턱을 낮추면
    // 책상 전체가 선으로 막혀 물이 못 들어가고, 높이면 흐린 종이 테두리가 끊긴다.
    // 노이즈는 세게 뭉개면 사라지지만 종이 그림자는 몇 픽셀 폭이라 살아남는다.
    // 그래서 한 번 더, 이번에는 크게 뭉갠 그림으로 같은 일을 한다.
    tryEdges(sobelOn(boxBlur3(gray, w, h, 4), w, h));
  }

  detectCorners.info = bestInfo;           // 디버깅/측정용
  if (!best) return null;                  // 걸러 낼 것은 consider 에서 이미 걸렀다

  const coarse = best.map(p => [clamp(p[0], 0, w) / s, clamp(p[1], 0, h) / s]);
  if (fast) return coarse;
  const ref = refineOnSource(canvas, coarse, srcData);
  detectCorners.curve = ref ? ref.curve : null;   // 휨 정보는 호출부가 바로 받아 간다
  return ref ? ref.corners : coarse;
}

/* ================================== 2) 원근 보정(사다리꼴 → 직사각형) */
function solve(A, b, n) {
  for (let col = 0; col < n; col++) {
    let piv = col;
    for (let r = col + 1; r < n; r++) if (Math.abs(A[r][col]) > Math.abs(A[piv][col])) piv = r;
    if (Math.abs(A[piv][col]) < 1e-12) return null;
    [A[col], A[piv]] = [A[piv], A[col]];
    [b[col], b[piv]] = [b[piv], b[col]];
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const f = A[r][col] / A[col][col];
      if (!f) continue;
      for (let k = col; k < n; k++) A[r][k] -= f * A[col][k];
      b[r] -= f * b[col];
    }
  }
  const x = new Float64Array(n);
  for (let i = 0; i < n; i++) x[i] = b[i] / A[i][i];
  return x;
}

/** dst(직사각형) → src(사진 속 사각형) 로 보내는 호모그래피 계수 */
function homography(dst, src) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = dst[i], [u, v] = src[i];
    A.push([x, y, 1, 0, 0, 0, -x * u, -y * u]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -x * v, -y * v]); b.push(v);
  }
  return solve(A, b, 8);
}

/**
 * 사진 속 사다리꼴만 보고 "원래 종이의 가로/세로 비"를 복원한다.
 *
 * 변 길이 평균만 쓰면 원근으로 눌린 비율이 그대로 남는다(비스듬히 찍으면 10% 이상 오차).
 * 단위 정사각형 → 사각형 호모그래피 H를 구하고 K=diag(f,f,1)라 두면,
 * 종이가 직사각형이라는 조건은 K⁻¹H의 두 열 b1,b2 에 대해
 *   b1·b2 = 0      (직각)      → 초점거리 f 를 결정
 *   |b1|/|b2| = 비율            → 가로/세로
 * 로 나뉜다. 위/아래 변이 화면에서 평행하면(정면으로 좌우 회전 없이 찍은 흔한 경우)
 * f 는 원리적으로 구할 수 없으므로 휴대폰 표준 화각을 가정해 넣는다.
 * 비율 자체는 f 에 둔감해서 이 가정으로도 충분히 정확하다.
 */
function estimateAspect(corners, imgW, imgH) {
  const u0 = imgW / 2, v0 = imgH / 2;
  const q = corners.map(p => [p[0] - u0, p[1] - v0]);          // 주점을 원점으로
  const H = homography([[0, 0], [1, 0], [1, 1], [0, 1]], q);   // 단위 정사각형 → 사각형
  if (!H) return null;
  const [a0, a1, , a3, a4, , a6, a7] = H;

  // b1·b2 = 0  →  (a0*a1 + a3*a4)/f² + a6*a7 = 0
  let f2 = null;
  if (Math.abs(a6) > 1e-9 && Math.abs(a7) > 1e-9) {
    const cand = -(a0 * a1 + a3 * a4) / (a6 * a7);
    if (cand > 1e-6) f2 = cand;
  }
  if (f2 == null) {
    // 소실점이 무한대 → f 를 구할 수 없음. 일반적인 휴대폰 화각(약 70°)으로 가정.
    const f = 0.75 * Math.max(imgW, imgH);
    f2 = f * f;
  }

  const n1 = (a0 * a0 + a3 * a3) / f2 + a6 * a6;   // |b1|²
  const n2 = (a1 * a1 + a4 * a4) / f2 + a7 * a7;   // |b2|²
  if (!(n1 > 0) || !(n2 > 0)) return null;

  const a = Math.sqrt(n1 / n2);                    // 가로/세로
  return (a > 0.15 && a < 6) ? a : null;
}

/** corners 로 잘라 반듯하게 편 ImageData 반환 */
/** @param curve measureCurve 결과(없으면 평면으로 본다) */
function warp(srcCanvas, corners, maxOut, srcData, curve) {
  const [tl, tr, br, bl] = corners;
  let W = Math.round((dist(tl, tr) + dist(bl, br)) / 2);
  let H = Math.round((dist(tl, bl) + dist(tr, br)) / 2);

  // 원근으로 눌린 비율을 실제 종이 비율로 교정(넓이는 유지)
  const asp = estimateAspect(corners, srcCanvas.width, srcCanvas.height);
  if (asp) {
    const area = Math.max(1, W * H);
    H = Math.round(Math.sqrt(area / asp));
    W = Math.round(asp * H);
  }

  const s = Math.min(1, maxOut / Math.max(W, H));
  W = Math.max(16, Math.round(W * s));
  H = Math.max(16, Math.round(H * s));

  const hm = homography([[0, 0], [W, 0], [W, H], [0, H]], corners);
  if (!hm) return null;
  const [a0, a1, a2, a3, a4, a5, a6, a7] = hm;

  const sw = srcCanvas.width, sh = srcCanvas.height;
  const sd = srcData || srcCanvas.getContext("2d", { willReadFrequently: true })
                                 .getImageData(0, 0, sw, sh).data;
  const out = new ImageData(W, H);
  const od = out.data;

  const maxU = sw - 1, maxV = sh - 1, rowBytes = sw * 4;

  // 휨이 있으면 표본 격자를 그만큼 되민다. 변마다 2차식이 하나씩이므로
  // 열/행별로 미리 계산해 두면 안쪽 반복에서는 곱셈 두 번이면 된다.
  let curveTop = null, curveBot = null, curveLeft = null, curveRight = null;
  if (curve) {
    const ev = (c, t) => c[0] + c[1] * t + c[2] * t * t;
    curveTop = new Float32Array(W); curveBot = new Float32Array(W);
    for (let x = 0; x < W; x++) {
      const u = x / (W - 1 || 1);
      curveTop[x] = ev(curve.top, u) * H;
      curveBot[x] = (1 + ev(curve.bottom, u)) * H;
    }
    curveLeft = new Float32Array(H); curveRight = new Float32Array(H);
    for (let y = 0; y < H; y++) {
      const v = y / (H - 1 || 1);
      curveLeft[y] = ev(curve.left, v) * W;
      curveRight[y] = (1 + ev(curve.right, v)) * W;
    }
  }

  let o = 0;
  for (let y = 0; y < H; y++) {
    // 행 안에서는 y 항이 고정이므로 밖으로 뺀다
    const nu = a1 * y + a2, nv = a4 * y + a5, nd = a7 * y + 1;
    const fv = H > 1 ? y / (H - 1) : 0;
    const cl = curve ? curveLeft[y] : 0, cr = curve ? curveRight[y] : W;
    for (let x = 0; x < W; x++, o += 4) {
      let u, v;
      if (curve) {
        // 펴진 좌표 → 실제로 종이가 놓인 (휜) 좌표
        const fu = W > 1 ? x / (W - 1) : 0;
        const rx = cl + fu * (cr - cl);
        const ry = curveTop[x] + fv * (curveBot[x] - curveTop[x]);
        const den = a6 * rx + a7 * ry + 1;
        u = (a0 * rx + a1 * ry + a2) / den;
        v = (a3 * rx + a4 * ry + a5) / den;
      } else {
        const den = a6 * x + nd;
        u = (a0 * x + nu) / den;
        v = (a3 * x + nv) / den;
      }
      if (u < 0 || v < 0 || u > maxU || v > maxV) {
        od[o] = od[o+1] = od[o+2] = od[o+3] = 255;
        continue;
      }
      const x0 = u | 0, y0 = v | 0;
      const fx = u - x0, fy = v - y0;
      // 이웃 화소는 곱셈 대신 덧셈으로 짚는다
      const i00 = (y0 * sw + x0) * 4;
      const i10 = x0 < maxU ? i00 + 4 : i00;
      const i01 = y0 < maxV ? i00 + rowBytes : i00;
      const i11 = x0 < maxU ? i01 + 4 : i01;
      const gx = 1 - fx, gy = 1 - fy;
      const w00 = gx * gy, w10 = fx * gy, w01 = gx * fy, w11 = fx * fy;
      od[o]     = sd[i00]     * w00 + sd[i10]     * w10 + sd[i01]     * w01 + sd[i11]     * w11;
      od[o + 1] = sd[i00 + 1] * w00 + sd[i10 + 1] * w10 + sd[i01 + 1] * w01 + sd[i11 + 1] * w11;
      od[o + 2] = sd[i00 + 2] * w00 + sd[i10 + 2] * w10 + sd[i01 + 2] * w01 + sd[i11 + 2] * w11;
      od[o + 3] = 255;
    }
  }
  return out;
}

/* ============================== 3) 그림자 제거 + 글씨 또렷하게 */
function boxMean(gray, w, h, r) {
  const iw = w + 1;
  // 0~255 의 합이라 Int32 로 충분하다(255 * 4M ≒ 10억 < 2^31).
  // Float64 를 쓰면 메모리를 두 배로 읽고 쓰게 되어 그만큼 느려진다.
  const ii = new Int32Array(iw * (h + 1));
  for (let y = 0; y < h; y++) {
    let row = 0;
    for (let x = 0; x < w; x++) {
      row += gray[y * w + x];
      ii[(y + 1) * iw + x + 1] = ii[y * iw + x + 1] + row;
    }
  }
  const out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const y0 = Math.max(0, y - r), y1 = Math.min(h - 1, y + r);
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - r), x1 = Math.min(w - 1, x + r);
      const sum = ii[(y1 + 1) * iw + x1 + 1] - ii[y0 * iw + x1 + 1]
                - ii[(y1 + 1) * iw + x0]     + ii[y0 * iw + x0];
      out[y * w + x] = sum / ((y1 - y0 + 1) * (x1 - x0 + 1));
    }
  }
  return out;
}

/**
 * 배경(종이) 밝기를 국소 평균으로 추정해 나눠주면 그림자/조명 얼룩이 사라진다.
 * 채널별로 같은 배경값을 쓰기 때문에 빨간 펜 같은 색은 색을 유지한다.
 */
function enhance(img, mode) {
  if (mode === "photo") return img;
  const { width: w, height: h, data: d } = img;
  const n = w * h;
  const gray = new Uint8Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4)
    gray[i] = (d[p] * 299 + d[p + 1] * 587 + d[p + 2] * 114) / 1000 | 0;

  const r = Math.max(8, Math.round(Math.min(w, h) / 22));
  const bg = boxMean(gray, w, h, r);
  const gamma = mode === "bw" ? 2.6 : 1.45;

  // 언샤프 마스킹용 고주파 성분(3x3 평균과의 차이)을 가로 3탭으로 미리 모아 둔다.
  // 이미 만들어 둔 gray 를 그대로 쓰고 아래 본 루프에 합쳐, 별도 패스를 없앴다.
  // 세기 0.5 는 실측으로 고른 값이다(글씨 가장자리 선명도 +11%, 빨간펜 손실 0.8%).
  // 더 올리면 글씨는 조금 더 또렷해지지만 채점 표시 획이 깎여 나간다.
  const SHARP = 0.5, sharpOn = w >= 3 && h >= 3;
  const t = new Uint16Array(sharpOn ? n : 0);
  if (sharpOn) {
    for (let y = 0; y < h; y++) {
      const o = y * w;
      t[o] = gray[o] * 2 + gray[o + 1];
      for (let x = 1; x < w - 1; x++) t[o + x] = gray[o + x - 1] + gray[o + x] + gray[o + x + 1];
      t[o + w - 1] = gray[o + w - 2] + gray[o + w - 1] * 2;
    }
  }

  // 흰 점(white point) — 이 비율 이상은 종이로 보고 완전한 흰색으로 민다.
  //
  // 문제집 종이는 얇아서 뒷면 글씨가 비친다. 배경으로 나누기만 하면 비침이
  // 옅은 회색으로 남아 얼룩처럼 깔린다.
  //
  // 다만 이건 공짜가 아니다. 아주 흐리게 쓴 연필도 비침과 밝기가 비슷해서,
  // 세게 밀면 학생이 푼 답이 같이 지워진다. 실측한 값은 이렇다.
  //
  //   흰점   비침   흐린 연필(#b4b4b4)
  //   1.00   24.3      42.6      ← 비침이 그대로 남는다
  //   0.94    2.8      22.6      ← 여기를 골랐다
  //   0.88    0         1.4      ← 비침은 사라지지만 연필이 지워진다
  //
  // 비침이 조금 남는 것보다 답이 지워지는 쪽이 훨씬 나쁘므로 0.94 로 잡았다.
  // 보통 세기의 연필(#8e8e8e)은 107.8 → 94.2 로 거의 그대로다.
  const WHITE = 0.94;

  // 픽셀마다 Math.pow 를 3번씩 부르면 1000만 번이 넘어 이 단계가 제일 느려진다.
  // 밝기비(0~1)를 1024단계로 나눈 표를 미리 만들어 찾아 쓴다.
  const LUT_N = 1024, lut = new Uint8Array(LUT_N + 1);
  for (let i = 0; i <= LUT_N; i++)
    lut[i] = Math.pow(Math.min(1, i / LUT_N / WHITE), gamma) * 255 + 0.5;

  for (let y = 0, p = 0; y < h; y++) {
    const up = y > 0 ? -w : 0, dn = y < h - 1 ? w : 0, row = y * w;
    for (let x = 0; x < w; x++, p += 4) {
      const i = row + x;
      const inv = LUT_N / Math.max(24, bg[i]);
      const hi = sharpOn ? SHARP * (gray[i] - (t[i + up] + t[i] + t[i + dn]) / 9) : 0;
      if (mode === "bw") {
        const v = lut[Math.min(LUT_N, gray[i] * inv | 0)] + hi;
        d[p] = d[p + 1] = d[p + 2] = v < 0 ? 0 : v > 255 ? 255 : v;
      } else {
        const a = lut[Math.min(LUT_N, d[p]     * inv | 0)] + hi;
        const b = lut[Math.min(LUT_N, d[p + 1] * inv | 0)] + hi;
        const c = lut[Math.min(LUT_N, d[p + 2] * inv | 0)] + hi;
        d[p]     = a < 0 ? 0 : a > 255 ? 255 : a;
        d[p + 1] = b < 0 ? 0 : b > 255 ? 255 : b;
        d[p + 2] = c < 0 ? 0 : c > 255 ? 255 : c;
      }
    }
  }
  return img;
}

/* ========================================== 4) 한 장 처리 파이프라인 */
/**
 * 사진 한 장을 끝까지 처리한다. 메인 스레드와 워커 양쪽에서 그대로 돌아간다.
 * 예전에는 호출부가 "원본 축소 → 재인코딩" 을 하고 여기서 또 디코드해서
 * 같은 사진을 두 번 디코드했다. 한 번만 하도록 합쳤다.
 */
async function processImage(blob, o) {
  const src = await blobToCanvas(blob, o.srcMax);
  const srcBlob = o.makeSrc ? await canvasToBlob(src, 0.9) : null;

  // 원본 픽셀은 감지 재정렬과 원근 보정 양쪽에서 필요하다. 한 번만 읽는다.
  const srcData = src.getContext("2d", { willReadFrequently: true })
                     .getImageData(0, 0, src.width, src.height).data;

  let corners = o.corners, curve = o.curve || null;
  if (corners === undefined) {
    corners = detectCorners(src, srcData);
    curve = detectCorners.curve;          // 방금 잰 휨을 그대로 받아 간다
  }

  // 펴기 직전에 사각형을 한 번 더 본다.
  //
  // 편집 화면은 "적용" 단추에서 막지만, 이 함수로 들어오는 길은 그것 말고도
  // 있다. 돌리기·필터 바꾸기·앱을 다시 열어 저장된 페이지를 되살리기가 모두
  // 저장해 둔 corners 를 그대로 다시 태운다. 여기가 모든 길이 만나는 곳이라
  // 검사도 여기에 둔다. 안 두었을 때 실측: 꼬인 사각형이 565x1452 짜리
  // 거의 빈 그림(진한 화소 0.9%)으로, 세 점이 한 줄인 사각형이 653x671 짜리
  // 완전히 빈 그림으로 조용히 통과했다.
  if (corners && !usableQuad(corners, src.width, src.height)) corners = null;

  let img = corners ? warp(src, corners, o.outMax, srcData, curve) : null;
  if (!img) {
    const s = Math.min(1, o.outMax / Math.max(src.width, src.height));
    const w = Math.max(1, Math.round(src.width * s)), h = Math.max(1, Math.round(src.height * s));
    const c = mkCanvas(w, h);
    c.getContext("2d").drawImage(src, 0, 0, w, h);
    img = c.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, w, h);
  }

  enhance(img, o.filter);

  const flat = mkCanvas(img.width, img.height);
  flat.getContext("2d").putImageData(img, 0, 0);

  const rot = ((o.rot % 360) + 360) % 360;
  let final = flat;
  if (rot) {
    const swap = rot === 90 || rot === 270;
    final = mkCanvas(swap ? flat.height : flat.width, swap ? flat.width : flat.height);
    const ctx = final.getContext("2d");
    ctx.translate(final.width / 2, final.height / 2);
    ctx.rotate(rot * Math.PI / 180);
    ctx.drawImage(flat, -flat.width / 2, -flat.height / 2);
  }

  return { srcBlob, outBlob: await canvasToBlob(final, o.quality), corners: corners || null, curve };
}

/* ---- 워커: 무거운 처리를 화면 밖으로 -------------------------------
   보정 한 장에 메인 스레드를 0.5~1초 붙잡기 때문에, 그대로 두면
   연속 촬영 중 카메라 미리보기와 셔터가 그동안 멎는다.
   위 함수들을 그대로 문자열로 만들어 워커에 실어 보낸다(정의는 한 곳뿐). */
const PROC_FNS = [
  clamp, dist, cross3, mkCanvas, canvasToBlob, blobToCanvas, scratch,
  otsu, maskIntegral, closeMask, largestBlob, borderPoints, convexHull, simplifyHull,
  maxAreaQuad, fitLine, lineFrom, lineCross, refineQuad, orderCorners, polyArea, isConvexQuad, usableQuad,
  scoreQuad, boxBlur3, sobelOn, enclosedByEdges, fitQuad, measureCurve, refineOnSource, detectCorners, solve, homography, estimateAspect, warp, boxMean, enhance,
  processImage
];

/** 위 함수들을 그대로 소스 문자열로 — 워커 두 종류가 같이 쓴다 */
function procDefs() {
  return PROC_FNS.map(f => {
    const src = f.toString();
    return src.startsWith("function") ? src : `const ${f.name} = ${src};`;
  }).join("\n");
}

function workerSource() {
  const defs = procDefs();
  return defs + `
self.onmessage = async (e) => {
  const { id, blob, opts } = e.data;
  try {
    const r = await processImage(blob, opts);
    self.postMessage({ id, ok: true, r });
  } catch (err) {
    self.postMessage({ id, ok: false, error: String((err && err.message) || err) });
  }
};`;
}

/* ---- 프레임 잡기 전용 워커 -----------------------------------------
   셔터를 누른 순간 미리보기에서 한 컷을 떠 오는 일(createImageBitmap)은
   비동기처럼 생겼지만 실제로는 메인 스레드를 붙잡는다. 실측으로 매 컷 12ms,
   첫 컷은 56ms 였고 이게 "셔터를 누를 때마다 화면이 멎는" 마지막 원인이었다.

   MediaStreamTrackProcessor 로 카메라 프레임을 워커로 직접 흘려보내면,
   메인 스레드가 할 일은 "지금 한 장" 이라고 말하는 것뿐이다. 워커는 늘
   최신 프레임 하나만 들고 있다가 그것을 비트맵으로 만들어 넘겨준다. */
function grabberSource() {
  return procDefs() + `
let latest = null, reader = null, cv = null, cx = null;
self.onmessage = async (e) => {
  const d = e.data;
  if (d.readable) {                       // 카메라 프레임 흐름을 넘겨받는다
    reader = d.readable.getReader();
    (async () => {
      try {
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          if (latest) latest.close();     // 최신 한 장만 들고 있는다.
          latest = value;                 // 쌓아두면 카메라 파이프라인이 막힌다.
        }
      } catch (err) {}
    })();
    return;
  }
  if (d.grab) {
    if (!latest) { self.postMessage({ id: d.grab, ok: false }); return; }
    try {
      const bmp = await createImageBitmap(latest);
      self.postMessage({ id: d.grab, ok: true, bmp }, [bmp]);
    } catch (err) {
      self.postMessage({ id: d.grab, ok: false });
    }
    return;
  }

  // 미리보기 한 컷을 작게 줄여 종이를 찾아 본다.
  // 좌표만 돌려주므로 그림을 메인 스레드로 옮기지 않는다.
  if (d.look) {
    const reply = r => self.postMessage(Object.assign({ look: d.look }, r));
    if (!latest) { reply({ ok: false }); return; }
    try {
      const vw = latest.displayWidth || latest.codedWidth;
      const vh = latest.displayHeight || latest.codedHeight;
      if (!vw || !vh) { reply({ ok: false }); return; }
      const W = Math.max(64, Math.min(d.w || 300, vw));
      const H = Math.max(64, Math.round(vh * W / vw));
      if (!cv || cv.width !== W || cv.height !== H) {
        cv = new OffscreenCanvas(W, H);
        cx = cv.getContext("2d", { willReadFrequently: true });
      }
      cx.drawImage(latest, 0, 0, W, H);
      const px = cx.getImageData(0, 0, W, H).data;

      // 하얗게 날아간 화소 비율 — 유광 표지에 형광등이 비치면 여기가 치솟는다.
      //
      // 문턱을 254 로 잡은 건 재 보고 정한 값이다. 250 으로 잡았더니 잘 찍힌
      // 흰 종이(253,253,251)까지 전부 "날아갔다"고 세어, 멀쩡한 화면에 늘
      // 반사 경고가 떠 있고 자동 촬영이 아예 못 돌았다. 254 에서는 깨끗한
      // 종이가 0%, 작은 반사 얼룩이 2.8%, 유광 표지의 넓은 반사가 26% 로
      // 갈린다. 여기서부터가 글자가 실제로 지워지는 구간이다.
      let blown = 0, sum = 0;
      const n = W * H;
      for (let i = 0, p = 0; i < n; i++, p += 4) {
        if (px[p] >= 254 && px[p+1] >= 254 && px[p+2] >= 254) blown++;
        sum += (px[p] * 299 + px[p+1] * 587 + px[p+2] * 114) / 1000;
      }

      const q = detectCorners(cv, px, true);      // 안내선용 — 부분화소 정밀도는 불필요
      reply({
        ok: true, w: W, h: H,
        quad: q && usableQuad(q, W, H) ? q.map(pt => [pt[0] / W, pt[1] / H]) : null,
        blown: blown / n, mean: sum / n
      });
    } catch (err) { reply({ ok: false }); }
    return;
  }

  if (d.stop) {
    try { if (latest) latest.close(); } catch (err) {}
    latest = null;
    try { if (reader) reader.cancel(); } catch (err) {}
    reader = null;
  }
};`;
}

const grabber = { w: null, seq: 0, waiting: new Map(), onLook: null, looking: false };

/** @returns {boolean} 프레임 잡기를 워커로 넘겼는가 */
function startGrabber(track) {
  stopGrabber();                              // 이전 것이 남아 있으면 먼저 정리
  if (typeof MediaStreamTrackProcessor === "undefined" || typeof Worker === "undefined") return false;
  try {
    const proc = new MediaStreamTrackProcessor({ track });
    const url = URL.createObjectURL(new Blob([grabberSource()], { type: "text/javascript;charset=utf-8" }));
    const w = new Worker(url);
    URL.revokeObjectURL(url);
    w.onmessage = e => {
      if (e.data.look) {                      // 미리보기 살펴본 결과
        grabber.looking = false;
        if (grabber.onLook) grabber.onLook(e.data);
        return;
      }
      const done = grabber.waiting.get(e.data.id);
      if (!done) { if (e.data.bmp && e.data.bmp.close) e.data.bmp.close(); return; }
      grabber.waiting.delete(e.data.id);
      done(e.data.ok ? e.data.bmp : null);
    };
    w.onerror = () => stopGrabber();          // 실패하면 메인 스레드 방식으로 되돌아간다
    w.postMessage({ readable: proc.readable }, [proc.readable]);
    grabber.w = w;
    return true;
  } catch (e) {
    console.warn("프레임 워커를 쓸 수 없어 메인 스레드로 잡습니다:", e);
    return false;
  }
}

function stopGrabber() {
  if (!grabber.w) return;
  try { grabber.w.postMessage({ stop: true }); grabber.w.terminate(); } catch (e) {}
  grabber.w = null;
  grabber.looking = false;
  grabber.waiting.forEach(done => done(null));   // 기다리던 컷은 폴백으로 넘긴다
  grabber.waiting.clear();
}

/**
 * 미리보기를 한 번 살펴봐 달라고 한다.
 *
 * 답이 오기 전에 또 부탁하지 않는다. 폰이 느리면 요청만 쌓여 워커가 몇 초씩
 * 뒤처진 화면을 그리게 되고, 그러면 가이드 선이 손보다 늦게 따라온다.
 * @returns {boolean} 부탁했는가
 */
function askLook(w) {
  if (!grabber.w || grabber.looking) return false;
  grabber.looking = true;
  try { grabber.w.postMessage({ look: ++grabber.seq, w }); return true; }
  catch (e) { grabber.looking = false; return false; }
}

/** @returns {Promise<ImageBitmap|null>} 워커가 없거나 실패하면 null */
function grabFrame() {
  if (!grabber.w) return Promise.resolve(null);
  const id = ++grabber.seq;
  return new Promise(res => {
    grabber.waiting.set(id, res);
    grabber.w.postMessage({ grab: id });
    // 워커가 대답하지 않아도 셔터가 영영 멈추지 않게 한다
    setTimeout(() => { if (grabber.waiting.delete(id)) res(null); }, 3000);
  });
}

// 사진 여러 장을 동시에 처리하려면 워커도 여러 개여야 한다.
// 화면 갱신용으로 코어 하나는 남겨 둔다.
const POOL_SIZE = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1));

let pool = null, poolUrl = null, workerSeq = 0, workerDead = false;
const workerJobs = new Map();

// 촬영 중에는 동시 처리 수를 줄여 카메라 파이프라인에 CPU 를 양보한다.
let poolLimit = POOL_SIZE;
function setPoolLimit(n) { poolLimit = Math.max(1, Math.min(POOL_SIZE, n)); }

function makeWorker() {
  const w = new Worker(poolUrl);
  w.busy = 0;
  w.onmessage = e => {
    w.busy--;
    const job = workerJobs.get(e.data.id);
    if (!job) return;
    workerJobs.delete(e.data.id);
    e.data.ok ? job.res(e.data.r) : job.rej(new Error(e.data.error));
  };
  w.onerror = () => {                        // 하나라도 죽으면 메인 스레드로
    workerDead = true;
    pool = null;
    workerJobs.forEach(j => j.rej(new Error("워커 오류")));
    workerJobs.clear();
  };
  return w;
}

/**
 * 워커를 미리 만들어 둔다.
 *
 * 예전에는 첫 촬영 때 POOL_SIZE 개를 한꺼번에 만들었다. 그 한 번이 메인
 * 스레드를 103ms 붙잡아(실측) 첫 셔터에서만 화면이 눈에 띄게 멎었다.
 * 카메라를 여는 순간부터 구도를 잡는 1~2초 동안 한 개씩 나눠 만든다.
 */
function warmPool() {
  if (!getPool()) return;
  const idle = window.requestIdleCallback || (f => setTimeout(f, 30));
  const step = () => {
    if (workerDead || !pool || pool.length >= POOL_SIZE) {
      // 다 만들었으면 소스 주소를 놓아준다(이미 만들어진 워커는 영향 없음)
      if (poolUrl && pool && pool.length >= POOL_SIZE) { URL.revokeObjectURL(poolUrl); poolUrl = null; }
      return;
    }
    try { pool.push(makeWorker()); } catch { return; }
    idle(step);
  };
  idle(step);
}

function getPool() {
  if (pool || workerDead) return pool;
  try {
    if (typeof Worker === "undefined" || typeof OffscreenCanvas === "undefined") throw 0;
    poolUrl = URL.createObjectURL(new Blob([workerSource()], { type: "text/javascript;charset=utf-8" }));
    pool = [makeWorker()];        // 우선 하나만. 나머지는 warmPool 이 한가할 때 채운다.
  } catch (e) {
    workerDead = true; pool = null;
  }
  return pool;
}

/** @param {Blob|ImageBitmap} src 원본. 비트맵이면 복사 없이 워커로 넘긴다. */
function runProcess(src, opts) {
  const p = getPool();
  if (!p || !p.length) return processImage(src, opts);   // 폴백: 메인 스레드
  // 가장 한가한 워커에게 준다
  let w = p[0];
  for (const c of p) if (c.busy < w.busy) w = c;
  w.busy++;
  // 비트맵은 넘겨주기(transfer)로 보낸다. 3MP 픽셀을 복사하지 않으므로
  // 셔터를 눌러도 메인 스레드가 멎지 않는다. 대신 넘긴 뒤에는 이쪽에서 쓸 수 없다.
  const moved = typeof ImageBitmap !== "undefined" && src instanceof ImageBitmap;
  return new Promise((res, rej) => {
    const id = ++workerSeq;
    workerJobs.set(id, { res, rej });
    w.postMessage({ id, blob: src, opts }, moved ? [src] : []);
  }).catch(err => {
    // 넘겨준 비트맵은 이미 이쪽에 없다 → 메인 스레드로 다시 할 수 없다.
    // 호출부가 그 페이지를 목록에서 빼고 알려 준다.
    if (moved) throw err;
    console.warn("워커 처리 실패, 메인 스레드로 대체:", err);
    return processImage(src, opts);
  });
}

/** 목록을 POOL_SIZE 만큼 동시에 돌린다. 순서는 각 항목이 알아서 채우므로 상관없다. */
async function runPooled(items, fn) {
  let next = 0;
  const workers = Array.from({ length: Math.min(poolLimit, items.length) }, async () => {
    while (next < items.length) {
      const i = next++;
      await fn(items[i], i);
    }
  });
  await Promise.all(workers);
}

/** @param {boolean} first 처음 넣는 사진이면 축소한 원본도 함께 받아 보관한다 */
async function renderPage(page, first) {
  // 갓 찍은 사진은 아직 파일이 아니라 프레임(비트맵)이다. 워커가 그것으로
  // 보관용 srcBlob 을 만들어 돌려주고, 넘겨준 비트맵은 여기서 지운다.
  const input = page.srcBmp || page.srcBlob;
  page.srcBmp = null;
  const r = await runProcess(input, {
    corners: page.corners, curve: page.curve, filter: page.filter, rot: page.rot,
    srcMax: SRC_MAX, outMax: OUT_MAX, quality: state.settings.quality,
    makeSrc: !!first
  });
  if (r.srcBlob) page.srcBlob = r.srcBlob;
  if (page.corners === undefined) { page.corners = r.corners; page.curve = r.curve || null; }
  page.outBlob = r.outBlob;
  if (page.url) URL.revokeObjectURL(page.url);
  page.url = URL.createObjectURL(page.outBlob);
  return page;
}

/* ================================================== 페이지 추가/관리 */
let idSeq = Date.now();
const newId = () => `p${idSeq++}`;

async function addFiles(files) {
  const list = Array.from(files)
    .filter(f => f.type.startsWith("image/"))
    .sort((a, b) =>
      a.name.localeCompare(b.name, "ko", { numeric: true }) || a.lastModified - b.lastModified);
  if (!list.length) { toast("이미지 파일이 없어요"); return; }

  const added = [];
  for (const f of list) {
    const page = {
      id: newId(), srcBlob: f, outBlob: null, url: null,
      corners: undefined, rot: 0, filter: state.settings.filter, busy: true
    };
    state.pages.push(page); added.push(page);
  }
  render();

  const failed = [];
  let done = 0;
  try {
    // 여러 장을 동시에 돌린다. 각 페이지는 자기 자리를 채우므로 완료 순서는 상관없다.
    await runPooled(added, async (p, i) => {
      try {
        await renderPage(p, true);      // 축소한 원본 보관까지 한 번에
      } catch (e) {
