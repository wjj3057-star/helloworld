        // 읽지 못한 사진은 목록에 남기지 않는다.
        // (남겨두면 PDF 만들 때 빈 페이지로 걸려 앱이 멈춘다)
        console.error("사진 처리 실패:", list[i] && list[i].name, e);
        failed.push(list[i] ? list[i].name : "");
        const at = state.pages.indexOf(p);
        if (at >= 0) state.pages.splice(at, 1);
        await DB.delPage(p.id);
        done++; render();
        return;
      }
      p.busy = false;
      done++;
      busy(true, `보정 중… ${done}/${added.length}`, done / added.length);
      render();
      await DB.savePage(p, state.pages.indexOf(p));
    });
  } finally {
    busy(false);
  }
  await persistOrder();

  const ok = added.length - failed.length;
  if (failed.length) toast(`${ok}장 추가됨 · ${failed.length}장은 읽지 못했어요`, 3600);
  else toast(`${ok}장 추가됨`);
}

async function reprocess(page) {
  page.busy = true; render();
  busy(true, "다시 보정 중…");
  await nextFrame();
  try { await renderPage(page); } catch (e) { console.error(e); }
  page.busy = false;
  busy(false); render();
  await DB.savePage(page, state.pages.indexOf(page));
}

function movePage(idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= state.pages.length) return;
  const [p] = state.pages.splice(idx, 1);
  state.pages.splice(j, 0, p);
  render();
  persistOrder();
}

async function removePage(idx) {
  const p = state.pages[idx];
  if (!confirm(`${idx + 1}번 페이지를 삭제할까요?`)) return;
  if (p.url) URL.revokeObjectURL(p.url);
  state.pages.splice(idx, 1);
  render();
  await DB.delPage(p.id);
  await persistOrder();
}

/* =============================================================== 렌더 */
/*
   목록은 통째로 다시 만들지 않는다. 예전에는 render() 마다 grid.innerHTML=""
   로 전부 버리고 다시 만들었는데, 한 장 찍을 때마다 두 번 불리므로 30장쯤
   쌓이면 매번 카드 30개와 썸네일 30장을 다시 만들어 화면이 눈에 띄게 걸렸다
   (실측 최악 88ms). 카드를 페이지별로 들고 있다가 바뀐 것만 고친다.
*/
const cards = new Map();          // page.id → { el, wrap, numEl, thumb, num, url }

function makeCard(p) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="thumbwrap"><span class="num"></span></div>
    <div class="row">
      <button data-a="left"  title="앞으로">◀</button>
      <button data-a="edit"  title="편집">✎</button>
      <button data-a="right" title="뒤로">▶</button>
      <button data-a="del" class="del" title="삭제">🗑</button>
    </div>`;
  // 순서가 바뀌어도 맞도록 자리번호는 누를 때 다시 찾는다
  const at = fn => () => { const i = state.pages.indexOf(p); if (i >= 0) fn(i); };
  el.querySelector('[data-a="left"]').onclick  = at(i => movePage(i, -1));
  el.querySelector('[data-a="right"]').onclick = at(i => movePage(i, 1));
  el.querySelector('[data-a="del"]').onclick   = at(i => removePage(i));
  el.querySelector('[data-a="edit"]').onclick  = at(i => openEditor(i));
  return {
    el, wrap: el.querySelector(".thumbwrap"), numEl: el.querySelector(".num"),
    thumb: null, num: 0, url: undefined, open: at(i => openEditor(i))
  };
}

function render() {
  const grid = $("#grid");
  $("#empty").style.display = state.pages.length ? "none" : "";
  $("#count").textContent = `${state.pages.length}장`;
  $("#btnPdf").disabled = state.pages.length === 0;

  // 없어진 페이지의 카드부터 걷어낸다
  const alive = new Set(state.pages.map(p => p.id));
  for (const [id, c] of cards) {
    if (!alive.has(id)) { c.el.remove(); cards.delete(id); }
  }

  state.pages.forEach((p, i) => {
    let c = cards.get(p.id);
    if (!c) { c = makeCard(p); cards.set(p.id, c); }

    if (c.num !== i + 1) {
      c.num = i + 1;
      c.numEl.textContent = c.num;
      if (c.thumb && c.thumb.tagName === "IMG") c.thumb.alt = `${c.num}번 페이지`;
    }

    // 썸네일은 주소가 실제로 바뀌었을 때만 갈아 끼운다(그래야 다시 안 그린다)
    const url = p.busy ? null : p.url;
    if (c.url !== url) {
      c.url = url;
      if (c.thumb) c.thumb.remove();
      if (url) {
        const img = document.createElement("img");
        img.alt = `${c.num}번 페이지`;
        img.src = url;
        img.onclick = c.open;
        c.thumb = img;
      } else {
        const d = document.createElement("div");
        d.className = "spin";
        d.textContent = "보정 중…";
        c.thumb = d;
      }
      c.wrap.appendChild(c.thumb);
    }

    if (grid.children[i] !== c.el) grid.insertBefore(c.el, grid.children[i] || null);
  });
}

/* ====================================================== 잘라내기 편집 */
const ed = { idx: -1, corners: null, curve: null, src: null, imgUrl: null, scale: 1, filter: "doc", rot: 0 };

async function openEditor(idx) {
  const p = state.pages[idx];
  if (p.busy) return;
  ed.idx = idx; ed.filter = p.filter; ed.rot = p.rot;

  try {
    busy(true, "여는 중…");
    ed.src = await blobToCanvas(p.srcBlob, SRC_MAX);
    if (ed.imgUrl) URL.revokeObjectURL(ed.imgUrl);
    ed.imgUrl = URL.createObjectURL(p.srcBlob);

    // 로드 실패해도 반드시 끝나야 한다. 안 그러면 여기서 멈춰 화면이 잠긴다.
    const im = $("#cropImg");
    await new Promise((res, rej) => {
      im.onload = res;
      im.onerror = () => rej(new Error("미리보기를 불러오지 못했습니다"));
      im.src = ed.imgUrl;
    });

    ed.corners = p.corners
      ? p.corners.map(c => c.slice())
      : [[0, 0], [ed.src.width, 0], [ed.src.width, ed.src.height], [0, ed.src.height]];
    ed.curve = p.curve || null;

    $("#edTitle").textContent = `${idx + 1}번 페이지`;
    showRot();
    $$("#edFilter button").forEach(b => b.classList.toggle("sel", b.dataset.f === ed.filter));
    $("#editor").classList.add("on");
    requestAnimationFrame(layoutCrop);
  } catch (e) {
    console.error("편집 화면 열기 실패:", e);
    toast("이 페이지를 열지 못했어요");
    closeEditor();
  } finally {
    busy(false);                 // 실패해도 화면이 잠기지 않게
  }
}

function layoutCrop() {
  const im = $("#cropImg");
  const host = $("#cropHost");
  host.style.width = im.clientWidth + "px";
  host.style.height = im.clientHeight + "px";
  ed.scale = im.clientWidth / ed.src.width;
  drawCrop();
}

function drawCrop() {
  const host = $("#cropHost");
  // 손잡이는 한 번만 만들고 이후에는 위치만 옮긴다
  // (끌 때마다 DOM을 새로 만들면 느린 기기에서 끊긴다)
  let handles = $$(".handle", host);
  if (handles.length !== 4) {
    handles.forEach(h => h.remove());
    handles = [0, 1, 2, 3].map(i => {
      const h = document.createElement("div");
      h.className = "handle";
      h.onpointerdown = e => startDrag(e, i);
      host.appendChild(h);
      return h;
    });
  }
  const pts = ed.corners.map(c => [c[0] * ed.scale, c[1] * ed.scale]);
  const poly = $("#cropPoly");
  poly.setAttribute("points", pts.map(p => p.join(",")).join(" "));
  // 꼬인 사각형은 바로 보이게 표시한다. 적용도 막는다.
  const bad = !usableQuad(ed.corners, ed.src.width, ed.src.height);
  poly.classList.toggle("bad", bad);
  $("#edWarn").hidden = !bad;
  pts.forEach((p, i) => {
    handles[i].style.left = p[0] + "px";
    handles[i].style.top = p[1] + "px";
  });
}

/**
 * 돋보기 — 끌고 있는 모서리를 확대해 보여 준다.
 * 손가락이 정작 맞춰야 할 지점을 가리기 때문이다.
 * 손가락 반대쪽 위 구석에 띄워 가리지 않게 한다.
 */
function showLoupe(i) {
  const el = $("#loupe");
  if (!ed.imgUrl || !ed.src) { el.hidden = true; return; }
  const Z = 3, R = 52;                       // 배율, 반지름
  const iw = ed.src.width * ed.scale, ih = ed.src.height * ed.scale;
  const x = ed.corners[i][0] * ed.scale, y = ed.corners[i][1] * ed.scale;
  el.style.backgroundImage = `url("${ed.imgUrl}")`;
  el.style.backgroundSize = `${iw * Z}px ${ih * Z}px`;
  el.style.backgroundPosition = `${R - x * Z}px ${R - y * Z}px`;
  // 끄는 손이 왼쪽 위에 있으면 오른쪽 위로 피한다
  el.classList.toggle("right", x < iw / 2);
  el.hidden = false;
}
function hideLoupe() { $("#loupe").hidden = true; }

function startDrag(e, i) {
  e.preventDefault();
  showLoupe(i);
  const host = $("#cropHost");

  // 끄는 동안 편집 화면은 고정이라 자리가 바뀌지 않는다. 한 번만 잰다.
  // 손가락을 움직일 때마다 재면, 방금 옮겨 놓은 손잡이 때문에 브라우저가
  // 매번 배치를 다시 계산해야 한다(쓰기 → 읽기 → 쓰기).
  let rect = host.getBoundingClientRect();
  const remeasure = () => { rect = host.getBoundingClientRect(); };

  // 손가락 이벤트는 화면 주사율보다 빠르게 들어올 수 있다(기기에 따라 초당 240회).
  // 그때마다 그리면 그릴 수 없는 그림을 그리느라 입력이 밀린다. 프레임당 한 번만 그린다.
  let raf = 0, last = null;
  const draw = () => {
    raf = 0;
    const x = clamp((last.clientX - rect.left) / ed.scale, 0, ed.src.width);
    const y = clamp((last.clientY - rect.top) / ed.scale, 0, ed.src.height);
    ed.corners[i] = [x, y];
    ed.curve = null;          // 손으로 맞춘 사각형은 곧은 것으로 본다
    drawCrop();
    showLoupe(i);
  };
  const move = ev => { last = ev; if (!raf) raf = requestAnimationFrame(draw); };
  const up = () => {
    if (raf) { cancelAnimationFrame(raf); draw(); }   // 마지막 위치를 빠뜨리지 않는다
    hideLoupe();
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("resize", remeasure);
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("resize", remeasure);
}

/** 적용 전에는 회전 결과가 미리보기에 안 나타나므로 버튼에 각도를 띄운다 */
function showRot() {
  const b = $("#edRotate");
  b.textContent = ed.rot ? `⟳${ed.rot}°` : "⟳";
  b.style.width = ed.rot ? "auto" : "";
  b.style.padding = ed.rot ? "0 8px" : "";
  b.style.color = ed.rot ? "var(--accent)" : "";
}

function closeEditor() {
  $("#editor").classList.remove("on");
  if (ed.imgUrl) { URL.revokeObjectURL(ed.imgUrl); ed.imgUrl = null; }
  ed.src = null;
}

/* ========================================================= PDF 만들기 */
/**
 * JPEG들을 A4 페이지에 채워 넣은 PDF 바이트를 만든다.
 * 외부 라이브러리 없이 PDF 1.4 구조를 직접 작성한다.
 */
function buildPdf(images) {           // images: [{bytes, w, h}]
  const enc = new TextEncoder();
  const chunks = [];
  let len = 0;
  const put = v => {
    const u = typeof v === "string" ? enc.encode(v) : v;
    chunks.push(u); len += u.length;
  };

  const A4W = 595.28, A4H = 841.89, MARGIN = 14;
  const objects = [];                 // 1-based: objects[i] = 오프셋
  const nPages = images.length;
  // 1 = Catalog, 2 = Pages, 이후 페이지마다 3개(Page, Contents, Image)
  const pageObj = i => 3 + i * 3;
  const contObj = i => 4 + i * 3;
  const imgObj  = i => 5 + i * 3;
  const total = 2 + nPages * 3;

  put(new Uint8Array([0x25, 0x50, 0x44, 0x46, 0x2d, 0x31, 0x2e, 0x34, 0x0a,   // %PDF-1.4
                      0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));

  const begin = num => { objects[num] = len; put(`${num} 0 obj\n`); };
  const end = () => put("endobj\n");

  begin(1);
  put("<< /Type /Catalog /Pages 2 0 R >>\n"); end();

  begin(2);
  put(`<< /Type /Pages /Count ${nPages} /Kids [${
    images.map((_, i) => `${pageObj(i)} 0 R`).join(" ")}] >>\n`); end();

  images.forEach((im, i) => {
    // 여백 안에 비율 유지하며 최대로 배치
    const availW = A4W - MARGIN * 2, availH = A4H - MARGIN * 2;
    const sc = Math.min(availW / im.w, availH / im.h);
    const dw = im.w * sc, dh = im.h * sc;
    const dx = (A4W - dw) / 2, dy = (A4H - dh) / 2;

    begin(pageObj(i));
    put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${A4W.toFixed(2)} ${A4H.toFixed(2)}] ` +
        `/Resources << /XObject << /Im0 ${imgObj(i)} 0 R >> >> /Contents ${contObj(i)} 0 R >>\n`);
    end();

    const content = `q\n${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${dx.toFixed(2)} ${dy.toFixed(2)} cm\n/Im0 Do\nQ\n`;
    begin(contObj(i));
    put(`<< /Length ${enc.encode(content).length} >>\nstream\n`);
    put(content);
    put("endstream\n"); end();

    begin(imgObj(i));
    put(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} ` +
        `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);
    put(im.bytes);
    put("\nendstream\n"); end();
  });

  const xref = len;
  put(`xref\n0 ${total + 1}\n`);
  put("0000000000 65535 f \n");
  for (let i = 1; i <= total; i++)
    put(`${String(objects[i]).padStart(10, "0")} 00000 n \n`);
  put(`trailer\n<< /Size ${total + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

  const out = new Uint8Array(len);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

/**
 * JPEG 바이트에서 가로·세로를 읽는다(SOF 마커).
 *
 * 크기만 필요한데 그림 전체를 디코드하는 건 낭비다 — createImageBitmap 은
 * 한 장에 30~60ms 라 24장이면 1초 가까이 여기서 샌다. 마커 몇 개만 걸으면
 * 같은 답이 즉시 나온다. 형식이 예상과 다르면 null 을 돌려 디코드로 되돌아간다.
 */
function jpegSize(b) {
  if (b.length < 4 || b[0] !== 0xFF || b[1] !== 0xD8) return null;
  let i = 2;
  while (i + 9 < b.length) {
    if (b[i] !== 0xFF) return null;
    while (b[i] === 0xFF) i++;                   // 채움 바이트
    const m = b[i++];
    if (m === 0xD8 || (m >= 0xD0 && m <= 0xD9)) continue;   // 길이 없는 마커
    const len = (b[i] << 8) | b[i + 1];
    if (len < 2) return null;
    // SOF0~15 중 DHT(C4)·JPG(C8)·DAC(CC) 를 뺀 것이 프레임 머리다
    if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
      const h = (b[i + 3] << 8) | b[i + 4], w = (b[i + 5] << 8) | b[i + 6];
      return w > 0 && h > 0 ? { w, h } : null;
    }
    i += len;
  }
  return null;
}

async function makePdf() {
  if (!state.pages.length) return;
  if (state.pages.some(p => p.busy)) { toast("아직 보정 중인 페이지가 있어요"); return; }

  const ready = state.pages.filter(p => p.outBlob);
  if (!ready.length) { toast("내보낼 페이지가 없어요"); return; }

  let files;
  try {
    busy(true, "PDF 만드는 중…", 0);
    await nextFrame();

    const imgs = [];
    for (let i = 0; i < ready.length; i++) {
      const p = ready[i];
      busy(true, `PDF 만드는 중… ${i + 1}/${ready.length}`, i / ready.length);
      await nextFrame();
      const bytes = new Uint8Array(await p.outBlob.arrayBuffer());
      let size = jpegSize(bytes);
      if (!size) {                               // 형식이 예상 밖이면 그때만 디코드
        const bmp = await createImageBitmap(p.outBlob);
        size = { w: bmp.width, h: bmp.height };
        if (bmp.close) bmp.close();
      }
      imgs.push({ bytes, w: size.w, h: size.h });
    }

    // 용량 제한이 있으면 여러 개로 나눔
    const limit = (state.settings.splitMB || 0) * 1024 * 1024;
    const groups = [];
    if (limit > 0) {
      let cur = [], sz = 0;
      for (const im of imgs) {
        if (cur.length && sz + im.bytes.length > limit) { groups.push(cur); cur = []; sz = 0; }
        cur.push(im); sz += im.bytes.length;
      }
      if (cur.length) groups.push(cur);
    } else groups.push(imgs);

    const base = (state.settings.name || "문제집").trim().replace(/[\\/:*?"<>|]/g, "_") || "문제집";
    // toISOString() 은 UTC 라 한국(UTC+9)에서는 자정~오전 9시 사이에
    // 어제 날짜가 찍힌다. 사용자의 현지 날짜를 쓴다.
    const d = new Date();
    const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    files = groups.map((g, i) => {
      const bytes = buildPdf(g);
      const suffix = groups.length > 1 ? `_${i + 1}` : "";
      const name = `${base}${state.settings.withDate ? "_" + date : ""}${suffix}.pdf`;
      return new File([bytes], name, { type: "application/pdf" });
    });
  } catch (e) {
    console.error("PDF 만들기 실패:", e);
    toast("PDF를 만들지 못했어요. 페이지를 줄여서 다시 시도해 보세요", 3600);
    return;
  } finally {
    busy(false);                 // 실패해도 화면이 잠기지 않게
  }

  await deliver(files);
}

const blobToBase64 = blob => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(",")[1] || "");
  r.onerror = () => rej(r.error);
  r.readAsDataURL(blob);
});

async function deliver(files) {
  const total = files.reduce((s, f) => s + f.size, 0);
  const mb = (total / 1024 / 1024).toFixed(1);

  // 안드로이드 앱(WebView)에서는 navigator.share 가 파일 전송을 지원하지 않아
  // 네이티브 공유 시트로 넘긴다.
  if (window.AndroidBridge && AndroidBridge.beginShare) {
    try {
      AndroidBridge.beginShare();
      // 통째로 base64 로 바꾸면 30장짜리(10MB)가 13MB 문자열이 되어 한 번에
      // 메모리에 올라간다. 1MB 씩 잘라 보내면 언제나 그만큼만 쓴다.
      const CHUNK = 1024 * 1024;
      for (const f of files) {
        AndroidBridge.startFile(f.name);
        for (let off = 0; off < f.size; off += CHUNK) {
          AndroidBridge.appendFile(await blobToBase64(f.slice(off, off + CHUNK)));
        }
        AndroidBridge.endFile();
      }
      AndroidBridge.endShare();
      toast(`공유 앱을 선택하세요 (${files.length}개, ${mb}MB)`);
      return;
    } catch (e) {
      console.error("앱 공유 실패, 저장으로 대체:", e);
    }
  }

  if (navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({ files, title: files[0].name, text: "문제집 스캔본입니다." });
      toast(`전송 완료 (${files.length}개, ${mb}MB)`);
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;   // 사용자가 취소
    }
  }
  for (const f of files) {
    const url = URL.createObjectURL(f);
    const a = document.createElement("a");
    a.href = url; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    await new Promise(r => setTimeout(r, 350));
  }
  toast(`PDF ${files.length}개 저장됨 (${mb}MB)`);
}

/* ========================================================= 연속 촬영 */
const cam = { stream: null, count: 0, torch: false };

async function openCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $("#fileShot").click(); return;                      // 카메라 앱으로 대체
  }
  try {
    // 예전엔 2400x3200(7.7MP)을 요청해 폭 400px 화면에 그렸다. 폰이 초당
    // 200MP 넘게 옮기느라 미리보기가 실제보다 한 박자 늦었다.
    //
    // 1500x2000(3MP)이면 부담이 2.6배 줄면서도, 종이가 화면을 채울 때
    // 잘라낸 페이지가 결과 상한(1700px)에 딱 맞아 화질 손해가 없다.
    //
    // 세로로 요청하는 게 중요하다. 같은 3MP 라도 가로(2000x1500)로 받으면
    // 폰을 세로로 든 상태에서 종이가 프레임의 일부만 차지해 1350px 로 떨어진다.
    await startStream();
  } catch (e) {
    toast("카메라를 열 수 없어 촬영 앱으로 대체합니다");
    $("#fileShot").click(); return;
  }

  // 보정이 CPU를 다 쓰면 카메라 파이프라인이 밀린다. 촬영 중에는 양보한다.
  setPoolLimit(POOL_SIZE - 2);
  // 첫 셔터에서 워커를 만드느라 멎지 않도록, 구도 잡는 동안 미리 만들어 둔다.
  warmPool();

  cam.count = 0;
  $("#camCount").textContent = "0장";
  $("#cam").classList.add("on");
}

/** 카메라 하드웨어를 잡고 미리보기를 띄운다 */
async function startStream() {
  cam.stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: "environment" },
      width: { ideal: 1500 }, height: { ideal: 2000 },
      frameRate: { ideal: 30 },
      // 가까이 대고 찍으면 고정 초점으로는 작은 수식·한자가 뭉개진다.
      // advanced 는 "되면 해 달라"는 뜻이라 지원하지 않는 기기에서도 안전하다.
      advanced: [{ focusMode: "continuous" }]
    },
    audio: false
  });
  // 잡는 사이에 화면을 벗어났으면 바로 놓아 준다
  if (document.hidden) { stopStream(); throw new Error("화면이 가려짐");}
  const v = $("#video");
  v.srcObject = cam.stream;
  await v.play().catch(() => {});
  // 프레임 잡기를 워커로 넘긴다. 안 되는 환경이면 셔터에서 직접 잡는다.
  const track = cam.stream.getVideoTracks()[0];
  const onWorker = track ? startGrabber(track) : false;
  setupTorch(track);
  keepAwake(true);
  // 실시간 테두리와 자동 촬영은 워커가 있을 때만 한다. 메인 스레드에서
  // 매번 종이를 찾으면 미리보기가 그만큼 멎어 촬영 자체가 더 나빠진다.
  $("#camAuto").hidden = !onWorker;
  if (onWorker) startLive();
}

/* ---- 손전등 --------------------------------------------------------
   스탠드 불빛을 등지고 찍으면 폰 그림자가 종이에 그대로 드리운다.
   기기가 지원할 때만 버튼을 띄운다(대부분의 노트북 카메라는 없다). */
function setupTorch(track) {
  const btn = $("#camTorch");
  btn.hidden = true;
  btn.setAttribute("aria-pressed", "false");
  cam.torch = false;
  if (!track || !track.getCapabilities) return;
  let caps;
  try { caps = track.getCapabilities(); } catch (e) { return; }
  if (!caps || !caps.torch) return;
  btn.hidden = false;
}

/**
 * 화면을 누른 곳에 초점 맞추기.
 *
 * 연속 초점만으로는 종이 대신 책상이나 손에 초점이 가는 일이 있다.
 * 미리보기는 object-fit:cover 라 화면과 영상의 비율이 달라 잘려 있으므로,
 * 그 잘린 만큼을 되돌려야 누른 자리가 영상의 어디인지 알 수 있다.
 */
async function tapFocus(ev) {
  const track = cam.stream && cam.stream.getVideoTracks()[0];
  if (!track || !track.getCapabilities) return;
  let caps;
  try { caps = track.getCapabilities(); } catch (e) { return; }
  if (!caps || !caps.pointsOfInterest) return;

  const v = $("#video");
  const r = v.getBoundingClientRect();
  if (!r.width || !r.height || !v.videoWidth) return;
  // cover: 영상이 화면보다 큰 쪽이 잘린다
  const scale = Math.max(r.width / v.videoWidth, r.height / v.videoHeight);
  const shownW = v.videoWidth * scale, shownH = v.videoHeight * scale;
  const x = (ev.clientX - r.left + (shownW - r.width) / 2) / shownW;
  const y = (ev.clientY - r.top + (shownH - r.height) / 2) / shownH;
  if (x < 0 || x > 1 || y < 0 || y > 1) return;

  try {
    await track.applyConstraints({ advanced: [{ pointsOfInterest: [{ x, y }] }] });
    const ring = $("#focusRing");
    // 링은 #cam(화면 전체) 기준으로 놓인다. 비디오 기준 좌표를 쓰면
    // 상단 바 높이만큼 위에 그려진다(실측 55px) — 누른 곳과 어긋난다.
    const host = $("#cam").getBoundingClientRect();
    ring.style.left = (ev.clientX - host.left) + "px";
    ring.style.top = (ev.clientY - host.top) + "px";
    ring.classList.remove("on");
    void ring.offsetWidth;                    // 애니메이션 다시 시작
    ring.classList.add("on");
  } catch (e) {
    // 지원한다고 해 놓고 거절하는 기기가 있다. 조용히 넘어간다.
  }
}

async function toggleTorch() {
  const track = cam.stream && cam.stream.getVideoTracks()[0];
  if (!track) return;
  const on = !cam.torch;
  try {
    await track.applyConstraints({ advanced: [{ torch: on }] });
    cam.torch = on;
    $("#camTorch").setAttribute("aria-pressed", on ? "true" : "false");
  } catch (e) {
    console.warn("손전등을 켜지 못했습니다:", e);
    toast("이 기기에서는 조명을 쓸 수 없어요");
    $("#camTorch").hidden = true;
  }
}

/* ---- 미리보기에서 종이 따라가기 ------------------------------------
   찍고 나서야 잘못 잡힌 걸 아는 것보다, 찍기 전에 테두리를 보여 주는 편이
   훨씬 낫다. 워커가 200ms 마다 한 번씩 작게 줄인 화면을 살펴 종이를 찾고,
   여기서는 그 결과를 다듬어 그리고 "가만히 있으면 알아서 찍기"를 맡는다. */
const live = {
  timer: null,
  smooth: null,      // 화면에 그리는 사각형(정규좌표, 흔들림 뺀 것)
  raw: null,         // 직전에 워커가 준 그대로 — 흔들림을 재는 데 쓴다
  still: 0,          // 몇 번 연속으로 가만히 있었나
  auto: true,
  cooldown: 0,       // 이 시각 전에는 자동으로 찍지 않는다
  tip: null,
  ec: 0, ecAt: 0,    // 노출 보정 현재값과 마지막으로 건드린 시각
  sentAt: 0, cost: 0 // 한 번 살펴보는 데 걸린 시간(다음 간격을 여기서 정한다)
};

const LIVE_W = 300;        // 워커가 살펴볼 그림의 가로(px)
const LIVE_MS = 200;       // 살펴보는 간격
const STILL_HOLD = 5;      // 이만큼 연속으로 가만히 있으면 찍는다(≈1초)
const STILL_EPS = 0.014;   // "가만히"의 기준 — 화면 너비의 1.4%
const MIN_AREA = 0.16;     // 종이가 화면의 이만큼은 차지해야 자동으로 찍는다
const BLOWN_BAD = 0.02;    // 하얗게 날아간 화소가 이보다 많으면 경고

function startLive() {
  stopLive();
  const cvs = $("#camGuide");
  if (!cvs || !cvs.getContext) return;
  grabber.onLook = onLook;
  live.smooth = live.raw = null;
  live.still = 0;
  live.cooldown = 0;
  live.cost = 0;
  scheduleLook(0);
}

/**
 * 다음에 살펴볼 시각을 잡는다.
 *
 * 고정 간격으로 부르지 않는 이유: 보급형 폰에서 한 번 살펴보는 데 실측
 * 90ms(느릴 땐 200ms)가 걸린다. 200ms 마다 꼬박꼬박 부르면 그 폰은 워커 한
 * 개를 거의 쉬지 않고 돌리게 되어 배터리가 닳고 폰이 뜨거워진다.
 * 직전에 걸린 만큼은 쉬게 해서, 아무리 느린 폰이라도 절반은 놀도록 한다.
 */
function scheduleLook(delay) {
  if (live.timer) clearTimeout(live.timer);
  live.timer = setTimeout(() => {
    live.timer = null;
    if (!$("#cam").classList.contains("on")) return;
    if (document.hidden || !grabber.w) { scheduleLook(LIVE_MS); return; }
    live.sentAt = performance.now();
    if (!askLook(LIVE_W)) scheduleLook(LIVE_MS);   // 아직 앞의 것이 안 돌아왔다
  }, delay);
}

function stopLive() {
  if (live.timer) { clearTimeout(live.timer); live.timer = null; }
  grabber.onLook = null;
  live.smooth = live.raw = null;
  live.still = 0;
  setTip(null);
  const cvs = $("#camGuide");
  if (cvs && cvs.getContext && cvs.width) cvs.getContext("2d").clearRect(0, 0, cvs.width, cvs.height);
}

function setTip(text) {
  if (live.tip === text) return;
  live.tip = text;
  const el = $("#camTip");
  el.textContent = text || "";
  el.hidden = !text;
}

/** 워커가 살펴본 결과 한 건 */
function onLook(r) {
  if (live.sentAt) {
    const took = performance.now() - live.sentAt;
    live.cost = live.cost ? live.cost * 0.7 + took * 0.3 : took;
  }
  if (!$("#cam").classList.contains("on")) return;
  scheduleLook(Math.max(LIVE_MS, Math.round(live.cost)));

  const q = (r && r.ok && r.quad) || null;

  // 흔들림 재기: 직전 결과와 견주어 가장 많이 움직인 모서리
  let moved = Infinity;
  if (q && live.raw) {
    moved = 0;
    for (let i = 0; i < 4; i++) moved = Math.max(moved, dist(q[i], live.raw[i]));
  }
  live.raw = q;

  if (!q) {
    live.smooth = null;
    live.still = 0;
  } else if (!live.smooth || moved > 0.25) {
    live.smooth = q;                 // 처음이거나 확 바뀌었으면 그냥 옮겨 간다
    live.still = 0;
  } else {
    // 지수 이동 평균. 카메라를 든 손이 미세하게 떨리면 매 프레임 몇 px 씩
    // 튀는데, 그대로 그리면 테두리가 부들부들 떨려 보인다. 0.35 는 따라오는
    // 속도(종이를 옮기면 반 박자 안에 붙는다)와 안정감 사이의 절충이다.
    const a = 0.35;
    live.smooth = live.smooth.map((p, i) => [p[0] + (q[i][0] - p[0]) * a, p[1] + (q[i][1] - p[1]) * a]);
    live.still = moved < STILL_EPS ? live.still + 1 : 0;
  }

  drawGuide();
  advise(r);
  maybeAutoShoot(r, q);
}

/** 빛과 밝기를 보고 한 줄 안내를, 필요하면 노출도 손본다 */
function advise(r) {
  if (!r || !r.ok) return;
  if (r.blown > BLOWN_BAD) {
    // 화면 전체가 밝으면 카메라가 흰 종이에 속아 과다 노출된 것 —
    // 노출을 낮추면 실제로 돌아온다. 한 군데만 번쩍이면 반사라서
    // 노출을 낮춰도 그 자리는 되살아나지 않는다. 각도를 바꾸는 수밖에 없다.
    if (r.mean > 200) { nudgeExposure(-1); setTip("너무 밝아요 — 노출을 낮추는 중"); }
    else setTip("빛이 반사돼 글자가 지워져요 — 각도를 조금 바꿔 보세요");
  } else if (r.mean < 45) {
    setTip("어두워요 — 조명을 켜거나 밝은 곳에서 찍어 주세요");
  } else {
    if (r.blown < 0.02) nudgeExposure(0);
    setTip(null);
  }
}

/**
 * 노출 보정을 한 칸 낮추거나 되돌린다.
 *
 * dir<0 이면 한 칸 내리고, 0 이면 기본값으로 되돌린다. 기기가 지원할 때만
 * 움직이고, 1.5초 안에 두 번 건드리지 않는다(카메라가 다시 맞출 틈을 준다).
 */
function nudgeExposure(dir) {
  const now = Date.now();
  if (now - live.ecAt < 1500) return;
  const track = cam.stream && cam.stream.getVideoTracks()[0];
  if (!track || !track.getCapabilities) return;
  let caps;
  try { caps = track.getCapabilities(); } catch (e) { return; }
  const ec = caps && caps.exposureCompensation;
  if (!ec || typeof ec.min !== "number") return;

  const step = ec.step || (ec.max - ec.min) / 12 || 0.1;
  const want = dir < 0 ? Math.max(ec.min, live.ec - step * 2) : 0;
  if (Math.abs(want - live.ec) < step / 2) return;
  live.ecAt = now;
  track.applyConstraints({ advanced: [{ exposureMode: "continuous", exposureCompensation: want }] })
       .then(() => { live.ec = want; })
       .catch(() => {});
}

/** 다듬은 사각형을 미리보기 위에 그린다 */
function drawGuide() {
  const cvs = $("#camGuide"), v = $("#video"), host = $("#cam");
  if (!cvs || !cvs.getContext) return;
  const rect = host.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.round(rect.width * dpr), H = Math.round(rect.height * dpr);
  if (cvs.width !== W || cvs.height !== H) { cvs.width = W; cvs.height = H; }
  const g = cvs.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, rect.width, rect.height);
  if (!live.smooth || !v.videoWidth) return;

  // 미리보기는 object-fit:cover 라 영상의 일부가 잘려 있다. 화면 좌표로 옮길 때
  // 그 잘린 만큼을 더해 준다(탭 초점에서 쓰는 계산의 반대 방향).
  const vr = v.getBoundingClientRect();
  const scale = Math.max(vr.width / v.videoWidth, vr.height / v.videoHeight);
  const shownW = v.videoWidth * scale, shownH = v.videoHeight * scale;
  const ox = vr.left - rect.left - (shownW - vr.width) / 2;
  const oy = vr.top - rect.top - (shownH - vr.height) / 2;
  const pt = p => [ox + p[0] * shownW, oy + p[1] * shownH];

  const ready = live.still >= STILL_HOLD - 2;
  g.beginPath();
  live.smooth.forEach((p, i) => { const [x, y] = pt(p); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.closePath();
  g.fillStyle = ready ? "rgba(45,140,255,.22)" : "rgba(255,255,255,.10)";
  g.fill();
  g.lineWidth = 3;
  g.strokeStyle = ready ? "#2d8cff" : "rgba(255,255,255,.85)";
  g.stroke();
  g.fillStyle = g.strokeStyle;
  live.smooth.forEach(p => {
    const [x, y] = pt(p);
    g.beginPath(); g.arc(x, y, 5, 0, Math.PI * 2); g.fill();
  });
}

/** 가만히 잘 잡혀 있으면 알아서 한 장 찍는다 */
function maybeAutoShoot(r, q) {
  if (!live.auto || !q || live.still < STILL_HOLD) return;
  if (Date.now() < live.cooldown) return;
  if (r.blown > BLOWN_BAD) return;               // 반사가 심하면 찍어 봐야 못 쓴다
  if (polyArea(q) < MIN_AREA) return;            // 종이가 너무 작게 잡혔다

  live.still = 0;
  live.cooldown = Date.now() + 2200;             // 같은 장을 두 번 찍지 않게
  try { if (navigator.vibrate) navigator.vibrate(35); } catch (e) {}
  shoot();
}

function setAuto(on) {
  live.auto = on;
  live.still = 0;
  $("#camAuto").setAttribute("aria-pressed", on ? "true" : "false");
  toast(on ? "가만히 들고 있으면 알아서 찍어요" : "자동 촬영을 껐어요");
}

/* ---- 화면 꺼짐 방지 --------------------------------------------------
   종이를 맞추는 동안 손을 안 대면 1분도 안 돼 화면이 꺼진다.
   촬영·편집 중에만 잡고, 끝나면 바로 놓아 준다. */
let wakeLock = null;
async function keepAwake(on) {
  if (!on) {
    if (wakeLock) { try { await wakeLock.release(); } catch (e) {} wakeLock = null; }
    return;
  }
  if (wakeLock || !navigator.wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    // 화면이 가려졌다 돌아오면 잠금이 풀려 있으므로 다시 잡는다
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) {
    wakeLock = null;                      // 배터리 절약 모드 등에서는 거절될 수 있다
  }
}

/** 카메라 하드웨어를 놓아 준다(촬영 화면은 그대로 둘 수 있다) */
function stopStream() {
  stopLive();
  stopGrabber();
  live.ec = 0;
  if (cam.stream) { cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; }
  $("#video").srcObject = null;
  cam.torch = false;
  $("#camTorch").hidden = true;
  $("#camTorch").setAttribute("aria-pressed", "false");
}

function closeCam() {
  $("#cam").classList.remove("on");
  setPoolLimit(POOL_SIZE);        // 촬영이 끝났으니 남은 큐를 전력으로 처리
  drainShots();
  stopStream();
  keepAwake(false);
}

/**
 * 화면을 벗어나면 카메라를 놓아 준다.
 *
 * 안 그러면 다른 앱으로 넘어가거나 화면을 꺼도 카메라가 계속 물려 있어서,
 * 상단의 카메라 사용 표시가 남고 배터리가 닳는다. 다른 앱이 카메라를 못 쓰기도 한다.
 * 돌아오면 다시 잡되, 촬영 화면과 지금까지 찍은 장수는 그대로 둔다.
 */
let camResuming = false;
async function setCamActive(active) {
  if (!$("#cam").classList.contains("on")) return;
  if (!active) { stopStream(); keepAwake(false); return; }
  keepAwake(true);
  if (cam.stream || camResuming) return;
  camResuming = true;
  try { await startStream(); }
  catch (e) {
    console.error("카메라를 다시 열지 못했습니다:", e);
    if (!document.hidden) { toast("카메라를 다시 열지 못했어요"); closeCam(); }
  } finally { camResuming = false; }
}
document.addEventListener("visibilitychange", () => setCamActive(!document.hidden));
// 안드로이드 앱에서는 액티비티가 멈출 때도 불러 준다(웹뷰 가시성만으로는 늦다)
window.__camActive = setCamActive;

const shotQueue = [];

// 셔터는 즉시 반응해야 한다. ImageCapture.takePhoto() 는 컷마다 수백 ms 가
// 걸리고 그 사이 스트림이 끊기면 그 컷이 통째로 사라져서 쓰지 않는다.
// 현재 미리보기 프레임을 그대로 가져온다.
//
// 예전에는 여기서 캔버스에 그린 뒤(1500x2000 읽기에 145ms, 그동안 화면이 통째로
// 멎음) JPEG 로 구웠다(3MP 에 1.4초, CPU 를 통째로 씀). 셔터를 누를 때마다
// 미리보기가 멎은 이유가 이것이다. 게다가 워커는 그 JPEG 를 다시 풀어야 했다.
//
// 지금은 프레임 참조(ImageBitmap)만 만들어 워커로 넘겨준다. 메인 스레드는
// 픽셀을 한 번도 만지지 않고, 굽고 다시 푸는 왕복도 통째로 없어진다.
async function shoot() {
  const v = $("#video");
  if (!v.videoWidth) return;

  // 숫자와 플래시가 먼저다. 픽셀 작업을 기다리게 하면 셔터감이 죽는다.
  const n = ++cam.count;
  $("#camCount").textContent = `${n}장`;
  const f = $("#flash");
  f.classList.add("on");
  setTimeout(() => f.classList.remove("on"), 20);

  // 워커가 들고 있는 최신 프레임을 받아온다(메인 스레드는 픽셀을 안 만진다).
  let bmp = await grabFrame();
  if (!bmp) {
    // 워커를 쓸 수 없는 환경 — 여기서 직접 잡는다(그만큼 잠깐 멎는다)
    try { bmp = await createImageBitmap(v); }
    catch (e) {
      console.error("프레임을 담지 못했습니다:", e);
      cam.count--;
      $("#camCount").textContent = `${cam.count}장`;
      toast("사진 한 장을 담지 못했어요");
      return;
    }
  }
  shotQueue.push({ bmp, name: `shot_${String(n).padStart(3, "0")}.jpg` });
  drainShots();
}

// 촬영은 막지 않고 뒤에서 조용히 보정한다.
// 워커 수만큼 동시에 돌려, 셔터를 빠르게 눌러도 큐가 밀리지 않게 한다.
let inFlight = 0;
function drainShots() {
  while (shotQueue.length && inFlight < poolLimit) {
    const shot = shotQueue.shift();
    const page = {
      id: newId(), srcBlob: null, srcBmp: shot.bmp, outBlob: null, url: null,
      corners: undefined, rot: 0, filter: state.settings.filter, busy: true
    };
    // 큐에서 꺼낸 순서대로 바로 넣어야 페이지 순서가 촬영 순서와 같아진다
    state.pages.push(page);
    inFlight++;
    render();

    (async () => {
      try {
        await renderPage(page, true);   // 축소한 원본 보관까지 한 번에
        page.busy = false;
        render();
        await DB.savePage(page, state.pages.indexOf(page));
      } catch (e) {
        // 처리하지 못한 사진은 목록에 남기지 않는다. 남겨두면 "보정 중…" 상태로
        // 계속 보이고, 저장까지 되어 다시 켰을 때 되살아난다.
        console.error("촬영 사진 처리 실패:", e);
        const at = state.pages.indexOf(page);
        if (at >= 0) state.pages.splice(at, 1);
        render();
        toast("사진 한 장을 처리하지 못했어요");
      } finally {
        inFlight--;
        drainShots();                   // 큐에 남은 게 있으면 이어서
      }
    })();
  }
}

/* =============================================================== 설정 */
function openSettings() {
  const s = state.settings;
  $("#setName").value = s.name;
  $("#setDate").checked = s.withDate;
  $("#setSplit").value = s.splitMB;
  $$("#setFilter button").forEach(b => b.classList.toggle("sel", b.dataset.f === s.filter));
  $$("#setQuality button").forEach(b => b.classList.toggle("sel", +b.dataset.q === s.quality));
  $("#settings").classList.add("on");
}
async function saveSettings() {
  const s = state.settings;
  s.name = $("#setName").value;
  s.withDate = $("#setDate").checked;
  s.splitMB = clamp(parseInt($("#setSplit").value || "0", 10) || 0, 0, 200);
  await DB.saveSettings(s);
}

/* ============================================================ 이벤트 */
$("#btnPick").onclick = () => $("#filePick").click();
$("#btnCam").onclick = openCam;
$("#btnPdf").onclick = makePdf;

$("#filePick").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("#fileShot").onchange = e => { addFiles(e.target.files); e.target.value = ""; };

$("#shutter").onclick = () => { live.cooldown = Date.now() + 1500; live.still = 0; shoot(); };
$("#camTorch").onclick = toggleTorch;
$("#camAuto").onclick = () => setAuto(!live.auto);
$("#video").onclick = tapFocus;
$("#camDone").onclick = () => { closeCam(); if (state.pages.length) toast("순서를 확인하고 PDF를 만드세요"); };

$("#edClose").onclick = () => { hideLoupe(); closeEditor(); };
$("#edFull").onclick = () => {
  ed.corners = [[0, 0], [ed.src.width, 0], [ed.src.width, ed.src.height], [0, ed.src.height]];
  ed.curve = null;
  drawCrop();
};
$("#edAuto").onclick = () => {
  const c = detectCorners(ed.src);
  if (!c) { toast("종이를 찾지 못했어요. 직접 맞춰 주세요"); return; }
  ed.corners = c; ed.curve = detectCorners.curve; drawCrop();
};
$("#edRotate").onclick = () => { ed.rot = (ed.rot + 90) % 360; showRot(); };
$$("#edFilter button").forEach(b => b.onclick = () => {
  ed.filter = b.dataset.f;
  $$("#edFilter button").forEach(x => x.classList.toggle("sel", x === b));
});
$("#edApply").onclick = async () => {
  const p = state.pages[ed.idx];
  // 네 모서리를 모두 본다. 예전엔 좌상단·우하단만 비교해서, 우상단이나
  // 좌하단만 옮긴 편집이 "전체 사용"으로 잘못 판정되어 버려졌다.
  const box = [[0, 0], [ed.src.width, 0], [ed.src.width, ed.src.height], [0, ed.src.height]];
  const full = ed.corners.every((c, i) =>
    Math.abs(c[0] - box[i][0]) < 0.5 && Math.abs(c[1] - box[i][1]) < 0.5);
  if (!full && !usableQuad(ed.corners, ed.src.width, ed.src.height)) {
    toast("모서리가 서로 꼬여 있어요. 네 점이 사각형이 되게 맞춰 주세요");
    return;
  }
  p.corners = full ? null : ed.corners.map(c => c.slice());
  p.curve = full ? null : (ed.curve || null);
  p.filter = ed.filter;
  p.rot = ed.rot;
  hideLoupe();
  closeEditor();
  await reprocess(p);
};

$("#btnSettings").onclick = openSettings;
$("#setClose").onclick = async () => { await saveSettings(); $("#settings").classList.remove("on"); };
$$("#setFilter button").forEach(b => b.onclick = () => {
  state.settings.filter = b.dataset.f;
  $$("#setFilter button").forEach(x => x.classList.toggle("sel", x === b));
  saveSettings();
});
$$("#setQuality button").forEach(b => b.onclick = () => {
  state.settings.quality = +b.dataset.q;
  $$("#setQuality button").forEach(x => x.classList.toggle("sel", x === b));
  saveSettings();
});
$("#setClear").onclick = async () => {
  if (!confirm("페이지를 전부 삭제할까요?")) return;
  state.pages.forEach(p => p.url && URL.revokeObjectURL(p.url));
  state.pages = [];
  await DB.clearPages();
  render();
  $("#settings").classList.remove("on");
  toast("전체 삭제됨");
};

// 화면을 돌리거나 화면 분할로 바뀌면 겹쳐 그린 것들의 좌표계가 어긋난다.
// 안드로이드에서는 액티비티가 다시 뜨지 않게 막아 두었으므로(configChanges),
// 크기 변화는 여기로만 온다.
window.addEventListener("resize", () => {
  if ($("#editor").classList.contains("on")) layoutCrop();
  if ($("#cam").classList.contains("on")) drawGuide();
});

/** 안드로이드 뒤로가기: 열려 있는 화면을 먼저 닫고, 없으면 앱을 종료시킨다 */
window.__handleBack = () => {
  if ($("#editor").classList.contains("on")) { closeEditor(); return true; }
  if ($("#cam").classList.contains("on")) { closeCam(); return true; }
  if ($("#settings").classList.contains("on")) {
    saveSettings(); $("#settings").classList.remove("on"); return true;
  }
  return false;
};
window.addEventListener("beforeunload", e => {
  if (state.pages.length) { e.preventDefault(); e.returnValue = ""; }
});

/* 오프라인 지원 — 망이 없어도 열리게 한다.
   앱(APK)은 파일을 안에 담고 있어 원래 오프라인이므로 등록하지 않는다. */
if ("serviceWorker" in navigator && !window.AndroidBridge && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});   // 실패해도 앱은 그대로 돈다
  });
}

/* ============================================================== 시작 */
(async function init() {
  const saved = await DB.loadSettings();
  if (saved) Object.assign(state.settings, saved);

  // 결과물이 없는 줄은 버린다. 예전 판에서 보정 중에 저장된 찌꺼기가 남아
  // 있으면 "보정 중…"에서 멈춘 빈 페이지로 되살아나고 PDF 도 만들 수 없다.
  const rows = (await DB.allPages() || []).filter(r => r && r.outBlob);
  if (rows.length) {
    rows.sort((a, b) => a.order - b.order);
    state.pages = rows.map(r => ({
      id: r.id, srcBlob: r.srcBlob, outBlob: r.outBlob,
      url: URL.createObjectURL(r.outBlob),
      corners: r.corners, curve: r.curve || null, rot: r.rot || 0, filter: r.filter || "doc", busy: false
    }));
    toast(`이전 작업 ${state.pages.length}장을 불러왔어요`);
  }
  render();
})();

// 테스트/자동화용
window.__scanner = { state, buildPdf, detectCorners, warp, enhance, addFiles, makePdf, renderPage, render, estimateAspect, homography, processImage, runProcess, isConvexQuad, usableQuad, refineWhy: () => refineOnSource.why || "" };
window.__live = live;
window.__grabber = grabber;
</script>
</body>
