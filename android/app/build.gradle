plugins { id 'com.android.application' }

// 서명 키는 저장소에 두지 않는다. 빌드할 때 환경변수(=GitHub Secrets)로 받는다.
// 키가 없으면 디버그 키로 서명해 빌드 자체는 계속되게 한다.
def ksPath = System.getenv("KEYSTORE_FILE")
def hasReleaseKey = ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()

android {
    namespace 'com.workbook.scanner'
    compileSdk 35

    defaultConfig {
        applicationId "com.workbook.scanner"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
                enableV1Signing true      // 구형 기기
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}

// 저장소 루트의 index.html 을 그대로 앱 안에 넣는다.
// 웹과 앱이 완전히 같은 코드를 쓰도록 하기 위함(사본을 따로 관리하지 않음).
tasks.register('copyWebApp', Copy) {
    from rootProject.file('../index.html')
    into layout.projectDirectory.dir('src/main/assets')
}
tasks.named('preBuild') { dependsOn 'copyWebApp' }
