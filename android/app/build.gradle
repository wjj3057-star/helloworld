plugins { id 'com.android.application' }

// 서명 키는 저장소에 두지 않는다. 빌드할 때 환경변수(=GitHub Secrets)로 받는다.
// 키가 없으면 디버그 키로 서명해 빌드 자체는 계속되게 한다.
def ksPath = System.getenv("KEYSTORE_FILE")
def hasReleaseKey = ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()

// 별칭은 비밀이 아니므로 기본값을 두고, 키 비밀번호는 보통 키스토어 비밀번호와
// 같으므로 따로 주지 않으면 그것을 쓴다. → 등록할 시크릿이 2개로 줄어든다.
def ksPassword = System.getenv("KEYSTORE_PASSWORD")
def ksAlias = System.getenv("KEY_ALIAS") ?: "workbook"
def ksKeyPassword = System.getenv("KEY_PASSWORD") ?: ksPassword

android {
    namespace 'com.workbook.scanner'
    compileSdk 35

    defaultConfig {
        applicationId "com.workbook.scanner"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
                enableV1Signing true      // 구형 기기
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // 소스에 한글이 들어 있다(토스트 문구, 공유 시트 제목, 주석).
        // 자바 17 의 javac 는 -encoding 을 안 주면 그 컴퓨터의 기본 문자셋으로
        // 읽는다. 리눅스 CI 는 UTF-8 이라 문제가 안 보이지만, 한국어 윈도우에서
        // gradlew.bat 으로 빌드하면 MS949 로 읽어 "PDF 저장 실패" 같은 문구가
        // 깨지거나 컴파일이 실패한다. 파일이 UTF-8 이라고 못을 박아 둔다.
        encoding = 'UTF-8'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}

// 저장소 루트의 index.html 을 그대로 앱 안에 넣는다.
// 웹과 앱이 완전히 같은 코드를 쓰도록 하기 위함(사본을 따로 관리하지 않음).
tasks.register('copyWebApp', Copy) {
    from rootProject.file('../index.html')
    into layout.projectDirectory.dir('src/main/assets')
}
tasks.named('preBuild') { dependsOn 'copyWebApp' }
